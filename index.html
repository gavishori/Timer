<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עוברים לאבן יהודה</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            min-height: 100%;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            background-attachment: fixed;
            color: #fff;
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px 60px;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            margin: 0 0 6px 0;
            font-weight: 700;
        }

        .subtitle {
            font-size: 1rem;
            color: #cfe0ff;
            margin-bottom: 26px;
        }

        .countdown {
            display: flex;
            direction: ltr; /* שומר על סדר ימים→שעות→דקות→שניות משמאל לימין, כמו שעון ספירה לאחור מקובל */
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 16px;
        }

        .unit {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 14px 18px;
            min-width: 82px;
            backdrop-filter: blur(6px);
        }

        .unit .value {
            font-size: 2rem;
            font-weight: 700;
            font-family: "Lucida Console", "Courier New", monospace;
            line-height: 1;
        }

        .unit .label {
            margin-top: 6px;
            font-size: 0.78rem;
            color: #cfe0ff;
        }

        .target-date {
            font-size: 0.9rem;
            color: #cfe0ff;
            margin-bottom: 30px;
        }

        .done-message {
            font-size: 1.8rem;
            font-weight: 700;
            display: none;
        }

        .tasks-section {
            display: flex;
            align-items: stretch;
            gap: 26px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 1100px;
            flex: 1;
        }

        .task-column {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 24px;
            flex: 1 1 420px;
            min-width: 300px;
            max-width: 520px;
            backdrop-filter: blur(6px);
            text-align: right;
            display: flex;
            flex-direction: column;
        }

        .task-column h2 {
            font-size: 1.4rem;
            margin: 0 0 18px 0;
            text-align: center;
        }

        .task-column h2 .task-count {
            font-size: 0.85rem;
            font-weight: 400;
            color: #cfe0ff;
        }

        .add-task {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }

        .add-task input {
            flex: 1;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            font-size: 1.05rem;
        }

        .add-task button {
            background: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 10px 20px;
            font-size: 1.3rem;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .add-task button:hover {
            background: #43a047;
        }

        .task-list {
            list-style: none;
            margin: 0;
            padding: 4px 4px 4px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            min-height: 420px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .task-list::-webkit-scrollbar {
            width: 8px;
        }

        .task-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 8px;
        }

        .task-list .empty-hint {
            color: #9fb4dd;
            font-size: 0.95rem;
            text-align: center;
            padding: 24px 8px;
        }

        .task-list li {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 14px 14px;
        }

        .task-list li .task-text {
            flex: 1;
            word-break: break-word;
            font-size: 1.05rem;
        }

        .task-list li.done {
            background: rgba(255, 255, 255, 0.04);
        }

        .task-list li.done .task-text {
            text-decoration: line-through;
            color: #8ea1c7;
        }

        .task-list li input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            flex-shrink: 0;
            accent-color: #4CAF50;
        }

        .task-list li .delete-task {
            background: none;
            border: none;
            color: #ffb3b3;
            font-size: 1.2rem;
            cursor: pointer;
            flex-shrink: 0;
            line-height: 1;
        }

        .task-list li .delete-task:hover {
            color: #ff6b6b;
        }

        @media (max-width: 640px) {
            .task-list {
                min-height: 260px;
                max-height: none;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>עוברים לאבן יהודה 🏡</h1>
        <div class="subtitle">הספירה לאחור למעבר הגדול</div>

        <div class="countdown" id="countdown">
            <div class="unit">
                <div class="value" id="days">00</div>
                <div class="label">ימים</div>
            </div>
            <div class="unit">
                <div class="value" id="hours">00</div>
                <div class="label">שעות</div>
            </div>
            <div class="unit">
                <div class="value" id="minutes">00</div>
                <div class="label">דקות</div>
            </div>
            <div class="unit">
                <div class="value" id="seconds">00</div>
                <div class="label">שניות</div>
            </div>
        </div>

        <div class="done-message" id="doneMessage">🎉 הגיע היום! בהצלחה במעבר! 🎉</div>

        <div class="target-date">היעד: 24.09.2026, 06:00</div>

        <div class="tasks-section">
            <div class="task-column" data-key="tasks">
                <h2>משימות <span class="task-count"></span></h2>
                <div class="add-task">
                    <input type="text" placeholder="משימה חדשה..." maxlength="200">
                    <button type="button">➕</button>
                </div>
                <ul class="task-list"></ul>
            </div>

            <div class="task-column" data-key="housework">
                <h2>עבודות בית <span class="task-count"></span></h2>
                <div class="add-task">
                    <input type="text" placeholder="משימה חדשה..." maxlength="200">
                    <button type="button">➕</button>
                </div>
                <ul class="task-list"></ul>
            </div>
        </div>
    </div>

    <script>
        // התאריך והשעה של המעבר: 24.09.2026, 06:00 לפי שעון ישראל (קיץ, UTC+3)
        // הכתיבה עם היסט מפורש (+03:00) מבטיחה שהספירה תהיה מדויקת
        // גם אם הדף נפתח ממכשיר שנמצא באזור זמן אחר
        const targetDate = new Date('2026-09-24T06:00:00+03:00');

        function updateCountdown() {
            const now = new Date();
            const diff = targetDate.getTime() - now.getTime();

            const countdownEl = document.getElementById('countdown');
            const doneEl = document.getElementById('doneMessage');

            if (diff <= 0) {
                countdownEl.style.display = 'none';
                doneEl.style.display = 'block';
                return;
            }

            const totalSeconds = Math.floor(diff / 1000);
            const days = Math.floor(totalSeconds / 86400);
            const hours = Math.floor((totalSeconds % 86400) / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);

        // ---- טבלת משימות ----
        function loadTasks(key) {
            try {
                const raw = localStorage.getItem('tasks-' + key);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                return [];
            }
        }

        function saveTasks(key, tasks) {
            localStorage.setItem('tasks-' + key, JSON.stringify(tasks));
        }

        function renderTasks(column) {
            const key = column.dataset.key;
            const listEl = column.querySelector('.task-list');
            const countEl = column.querySelector('.task-count');
            const tasks = loadTasks(key);

            const openCount = tasks.filter(t => !t.done).length;
            if (countEl) {
                countEl.textContent = tasks.length ? `(${openCount}/${tasks.length})` : '';
            }

            // משימות שבוצעו יורדות לסוף הרשימה
            const sorted = [...tasks].sort((a, b) => Number(a.done) - Number(b.done));

            listEl.innerHTML = '';

            if (sorted.length === 0) {
                const hint = document.createElement('li');
                hint.className = 'empty-hint';
                hint.textContent = 'אין משימות עדיין — הוסיפו למעלה ⬆';
                listEl.appendChild(hint);
                return;
            }

            sorted.forEach(task => {
                const li = document.createElement('li');
                if (task.done) li.classList.add('done');

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = task.done;
                checkbox.addEventListener('change', () => {
                    task.done = checkbox.checked;
                    saveTasks(key, tasks);
                    renderTasks(column);
                });

                const span = document.createElement('span');
                span.className = 'task-text';
                span.textContent = task.text;

                const deleteBtn = document.createElement('button');
                deleteBtn.type = 'button';
                deleteBtn.className = 'delete-task';
                deleteBtn.textContent = '✕';
                deleteBtn.title = 'מחק משימה';
                deleteBtn.addEventListener('click', () => {
                    const idx = tasks.indexOf(task);
                    if (idx > -1) tasks.splice(idx, 1);
                    saveTasks(key, tasks);
                    renderTasks(column);
                });

                li.appendChild(checkbox);
                li.appendChild(span);
                li.appendChild(deleteBtn);
                listEl.appendChild(li);
            });
        }

        function addTask(column) {
            const key = column.dataset.key;
            const input = column.querySelector('.add-task input');
            const text = input.value.trim();
            if (!text) return;

            const tasks = loadTasks(key);
            tasks.push({ text, done: false });
            saveTasks(key, tasks);
            input.value = '';
            renderTasks(column);
        }

        document.querySelectorAll('.task-column').forEach(column => {
            const button = column.querySelector('.add-task button');
            const input = column.querySelector('.add-task input');

            button.addEventListener('click', () => addTask(column));
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') addTask(column);
            });

            renderTasks(column);
        });
    </script>

</body>
</html>

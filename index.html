<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עוברים לאבן יהודה</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
        }

        .container {
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            margin: 0 0 8px 0;
            font-weight: 700;
        }

        .subtitle {
            font-size: 1rem;
            color: #cfe0ff;
            margin-bottom: 40px;
        }

        .countdown {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 30px;
        }

        .unit {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 18px;
            padding: 20px 22px;
            min-width: 100px;
            backdrop-filter: blur(6px);
        }

        .unit .value {
            font-size: 2.6rem;
            font-weight: 700;
            font-family: "Lucida Console", "Courier New", monospace;
            line-height: 1;
        }

        .unit .label {
            margin-top: 8px;
            font-size: 0.85rem;
            color: #cfe0ff;
        }

        .target-date {
            font-size: 0.95rem;
            color: #cfe0ff;
        }

        .done-message {
            font-size: 1.8rem;
            font-weight: 700;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>עוברים לאבן יהודה 🏡</h1>
        <div class="subtitle">הספירה לאחור למעבר הגדול</div>

        <div class="countdown" id="countdown">
            <div class="unit">
                <div class="value" id="days">00</div>
                <div class="label">ימים</div>
            </div>
            <div class="unit">
                <div class="value" id="hours">00</div>
                <div class="label">שעות</div>
            </div>
            <div class="unit">
                <div class="value" id="minutes">00</div>
                <div class="label">דקות</div>
            </div>
            <div class="unit">
                <div class="value" id="seconds">00</div>
                <div class="label">שניות</div>
            </div>
        </div>

        <div class="done-message" id="doneMessage">🎉 הגיע היום! בהצלחה במעבר! 🎉</div>

        <div class="target-date">היעד: 24.09.2026, 06:00</div>
    </div>

    <script>
        // התאריך והשעה של המעבר: 24.09.2026, 06:00 לפי שעון ישראל (קיץ, UTC+3)
        // הכתיבה עם היסט מפורש (+03:00) מבטיחה שהספירה תהיה מדויקת
        // גם אם הדף נפתח ממכשיר שנמצא באזור זמן אחר
        const targetDate = new Date('2026-09-24T06:00:00+03:00');

        function updateCountdown() {
            const now = new Date();
            const diff = targetDate.getTime() - now.getTime();

            const countdownEl = document.getElementById('countdown');
            const doneEl = document.getElementById('doneMessage');

            if (diff <= 0) {
                countdownEl.style.display = 'none';
                doneEl.style.display = 'block';
                return;
            }

            const totalSeconds = Math.floor(diff / 1000);
            const days = Math.floor(totalSeconds / 86400);
            const hours = Math.floor((totalSeconds % 86400) / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>

</body>
</html>

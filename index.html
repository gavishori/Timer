<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עוברים לאבן יהודה</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* אין גלילה אנכית (או אופקית) בדף כולו */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
        }

        /* פריסה: עמודת משימות | הטיימר במרכז | עמודת עבודות בית */
        .container {
            height: 100vh;
            display: flex;
            flex-direction: row;
            align-items: stretch;
            gap: 20px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* ---- עמודת המרכז: כותרת+טיימר קומפקטיים למעלה, ולוח שנה נגלל תחתיהם ---- */
        .center-panel {
            flex: 0 0 340px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            text-align: center;
            min-width: 0;
            min-height: 0;
        }

        .center-header {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.15rem;
            margin: 0 0 8px 0;
            font-weight: 700;
        }

        .countdown {
            display: flex;
            direction: ltr; /* שומר על סדר ימים→שעות→דקות→שניות משמאל לימין, כמו שעון ספירה לאחור מקובל */
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 8px;
        }

        .unit {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 5px 9px;
            min-width: 50px;
            backdrop-filter: blur(6px);
        }

        .unit .value {
            font-size: 1.15rem;
            font-weight: 700;
            font-family: "Lucida Console", "Courier New", monospace;
            line-height: 1;
        }

        .unit .label {
            margin-top: 2px;
            font-size: 0.62rem;
            color: #cfe0ff;
        }

        .center-meta {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            font-size: 0.72rem;
            color: #cfe0ff;
            margin-bottom: 8px;
        }

        .sync-status {
            color: #9fb4dd;
        }

        .timeline-header {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #cfe0ff;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            padding-top: 8px;
            margin-top: 8px;
            margin-bottom: 4px;
        }

        .tl-refresh-btn {
            background: none;
            border: none;
            color: #cfe0ff;
            font-size: 0.85rem;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 6px;
            line-height: 1;
        }

        .tl-refresh-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .tl-refresh-btn.spinning {
            animation: tl-spin 0.8s linear infinite;
        }

        @keyframes tl-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .tl-sync-status {
            flex-shrink: 0;
            font-size: 0.65rem;
            color: #9fb4dd;
            text-align: center;
            min-height: 1em;
            margin-bottom: 4px;
        }

        .timeline-wrap {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            text-align: right;
            padding-left: 4px;
        }

        .timeline-wrap::-webkit-scrollbar {
            width: 8px;
        }

        .timeline-wrap::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 8px;
        }

        .tl-month-group {
            margin-bottom: 4px;
        }

        .tl-month-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: none;
            border: none;
            color: #ffd166;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            font-family: inherit;
            cursor: pointer;
            padding: 6px 6px;
            margin-top: 10px;
            border-radius: 8px;
        }

        .tl-month-header:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .tl-month-group:first-child .tl-month-header {
            margin-top: 0;
        }

        .tl-month-arrow {
            font-size: 0.65rem;
            color: #cfe0ff;
            font-weight: 400;
        }

        .tl-month-content {
            display: none;
            padding-top: 4px;
        }

        .tl-month-group.open .tl-month-content {
            display: block;
        }

        .tl-entry {
            position: relative;
            display: flex;
            gap: 10px;
            padding-right: 4px;
            padding-bottom: 12px;
        }

        .tl-rail {
            position: relative;
            flex-shrink: 0;
            width: 14px;
        }

        .tl-rail::before {
            content: '';
            position: absolute;
            top: 14px;
            bottom: -12px;
            right: 6px;
            width: 2px;
            background: rgba(255, 255, 255, 0.2);
        }

        .tl-entry:last-child .tl-rail::before {
            display: none;
        }

        .tl-rail::after {
            content: '';
            position: absolute;
            top: 4px;
            right: 2px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #7fa8ff;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .tl-entry.is-past .tl-rail::after {
            background: #5c6f94;
        }

        .tl-entry.is-next .tl-rail::after {
            background: #4CAF50;
            box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.3);
        }

        .tl-content {
            flex: 1;
            min-width: 0;
        }

        .tl-entry.is-past .tl-content {
            opacity: 0.5;
        }

        .tl-date {
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .tl-entry.is-next .tl-date {
            color: #8bc34a;
        }

        .tl-date .tl-day {
            font-weight: 400;
            color: #cfe0ff;
            font-size: 0.72rem;
        }

        .tl-items {
            margin: 0;
            padding: 0;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .tl-items li {
            font-size: 0.78rem;
            color: #e3ebfb;
            line-height: 1.3;
            word-break: break-word;
        }

        .tl-empty {
            color: #9fb4dd;
            font-size: 0.85rem;
            text-align: center;
            padding: 20px 0;
        }

        .done-message {
            font-size: 1.6rem;
            font-weight: 700;
            display: none;
        }

        .export-btn {
            margin-top: 16px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #fff;
            padding: 8px 18px;
            border-radius: 10px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .export-btn:hover {
            background: rgba(255, 255, 255, 0.28);
        }

        /* ---- עמודות המשימות (שני הצדדים) ---- */
        .task-column {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 20px;
            flex: 1 1 0;
            min-width: 0;
            backdrop-filter: blur(6px);
            text-align: right;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .task-column h2 {
            font-size: 1.2rem;
            margin: 0 0 14px 0;
            text-align: center;
            flex-shrink: 0;
        }

        .task-column h2 .task-count {
            font-size: 0.8rem;
            font-weight: 400;
            color: #cfe0ff;
        }

        .add-task {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
            flex-shrink: 0;
        }

        .add-task input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            font-size: 1rem;
            min-width: 0;
        }

        .add-task button {
            background: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 8px 18px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background 0.15s ease;
            flex-shrink: 0;
        }

        .add-task button:hover {
            background: #43a047;
        }

        .task-list {
            list-style: none;
            margin: 0;
            padding: 4px 4px 4px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            min-height: 0; /* קריטי כדי שהרשימה תגלול בתוך עצמה ולא תדחוף את שאר הדף */
            overflow-y: auto;
        }

        .task-list::-webkit-scrollbar {
            width: 8px;
        }

        .task-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 8px;
        }

        .task-list .empty-hint {
            color: #9fb4dd;
            font-size: 0.95rem;
            text-align: center;
            padding: 24px 8px;
        }

        .task-list li {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 14px 14px;
        }

        .task-list li .task-body {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .task-list li .task-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .task-list li .task-text {
            flex: 1;
            word-break: break-word;
            font-size: 1.05rem;
        }

        .task-list li.done {
            background: rgba(255, 255, 255, 0.04);
        }

        .task-list li.done .task-text {
            text-decoration: line-through;
            color: #8ea1c7;
        }

        .task-list li input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            flex-shrink: 0;
            accent-color: #4CAF50;
            margin-top: 2px;
        }

        .task-list li .note-btn {
            background: none;
            border: none;
            color: #cfe0ff;
            font-size: 0.95rem;
            cursor: pointer;
            flex-shrink: 0;
            line-height: 1;
            padding: 3px 7px;
            border-radius: 6px;
        }

        .task-list li .note-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .task-list li .note-btn.has-note {
            color: #ffd166;
        }

        .task-list li .task-note-text {
            font-size: 0.82rem;
            font-style: italic;
            color: #b8c6e0;
            word-break: break-word;
            white-space: pre-wrap; /* שומר על ירידות שורה שהוזנו עם Shift+Enter */
            cursor: pointer;
        }

        .task-list li .note-input {
            width: 100%;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            font-size: 0.9rem;
            font-family: inherit;
            resize: none;
            overflow: hidden;
            display: block;
        }

        .task-list li .delete-task {
            background: none;
            border: none;
            color: #ffb3b3;
            font-size: 1.2rem;
            cursor: pointer;
            flex-shrink: 0;
            line-height: 1;
        }

        .task-list li .delete-task:hover {
            color: #ff6b6b;
        }

        /* מובייל: הכל נערם אנכית (משימות, טיימר, עבודות בית), והדף עצמו גולל -
           אין נעילת גובה, וכל רשימת משימות גדלה לפי התוכן שלה */
        @media (max-width: 820px) {
            html, body {
                height: auto;
                min-height: 100%;
                overflow-y: auto;
                overflow-x: hidden;
            }

            .container {
                height: auto;
                min-height: 100vh;
                flex-direction: column;
                align-items: stretch;
                padding: 14px;
                gap: 14px;
            }

            .center-panel {
                flex: 0 0 auto;
                order: -1;
            }

            .task-column {
                flex: 0 0 auto;
                min-height: 0;
            }

            .task-list {
                flex: 0 0 auto;
                min-height: 0;
                max-height: none;
                overflow-y: visible;
            }

            h1 {
                font-size: 1.2rem;
            }

            .unit {
                padding: 6px 10px;
                min-width: 56px;
            }

            .unit .value {
                font-size: 1.2rem;
            }

            .export-btn {
                display: none; /* ייצוא PDF זמין רק בתצוגת מחשב */
            }

            /* הלוח-שנה זורם עם שאר הדף במקום לגלול בתוך תיבה פנימית קטנה */
            .timeline-wrap {
                flex: 0 0 auto;
                min-height: 0;
                overflow-y: visible;
                max-height: none;
            }
        }

        /* ---- דוח PDF להדפסה - מוסתר במסך, מוצג רק ב-@media print ---- */
        .print-report {
            display: none;
        }

        @media print {
            html, body {
                height: auto;
                overflow: visible;
                background: #fff;
                color: #111;
            }

            .container {
                display: none;
            }

            .print-report {
                display: block;
                background: #fff;
                color: #111;
                padding: 0;
                direction: rtl;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            }

            .print-report h1 {
                font-size: 1.6rem;
                margin: 0 0 4px 0;
                color: #1e3c72;
            }

            .print-report .print-subtitle {
                font-size: 0.9rem;
                color: #555;
                margin-bottom: 16px;
            }

            .print-report .print-countdown {
                display: flex;
                direction: ltr;
                gap: 10px;
                margin-bottom: 20px;
            }

            .print-report .print-countdown .unit {
                border: 1px solid #ccc;
                border-radius: 10px;
                padding: 8px 14px;
                text-align: center;
                min-width: 70px;
            }

            .print-report .print-countdown .unit .value {
                font-size: 1.4rem;
                font-weight: 700;
                font-family: "Lucida Console", "Courier New", monospace;
            }

            .print-report .print-countdown .unit .label {
                font-size: 0.7rem;
                color: #666;
            }

            .print-report section {
                margin-bottom: 22px;
                page-break-inside: avoid;
            }

            .print-report h2 {
                font-size: 1.15rem;
                border-bottom: 2px solid #2a5298;
                padding-bottom: 4px;
                margin: 0 0 10px 0;
                color: #1e3c72;
            }

            .print-report .insights-box {
                background: #eef3fc;
                border: 1px solid #c9d9f2;
                border-radius: 10px;
                padding: 14px 16px;
            }

            .print-report .insights-box ul {
                margin: 0;
                padding-right: 18px;
            }

            .print-report .insights-box li {
                margin-bottom: 6px;
            }

            .print-report .print-task-list {
                list-style: none;
                margin: 0;
                padding: 0;
            }

            .print-report .print-task-list li {
                display: flex;
                align-items: flex-start;
                gap: 8px;
                padding: 6px 0;
                border-bottom: 1px solid #eee;
            }

            .print-report .print-task-list .box {
                flex-shrink: 0;
                font-size: 1rem;
            }

            .print-report .print-task-list .body {
                flex: 1;
            }

            .print-report .print-task-list .done .task-title {
                text-decoration: line-through;
                color: #888;
            }

            .print-report .print-task-list .note {
                font-size: 0.82rem;
                color: #666;
                font-style: italic;
                white-space: pre-wrap;
            }

            .print-report .print-empty {
                color: #888;
                font-size: 0.9rem;
            }

            .print-report .print-footer {
                margin-top: 20px;
                font-size: 0.75rem;
                color: #999;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="task-column" data-key="tasks">
            <h2>משימות <span class="task-count"></span></h2>
            <div class="add-task">
                <input type="text" placeholder="משימה חדשה..." maxlength="200">
                <button type="button">➕</button>
            </div>
            <ul class="task-list"></ul>
        </div>

        <div class="center-panel">
            <div class="center-header">
                <h1>עוברים לאבן יהודה 🏡</h1>

                <div class="countdown" id="countdown">
                    <div class="unit">
                        <div class="value" id="days">00</div>
                        <div class="label">ימים</div>
                    </div>
                    <div class="unit">
                        <div class="value" id="hours">00</div>
                        <div class="label">שעות</div>
                    </div>
                    <div class="unit">
                        <div class="value" id="minutes">00</div>
                        <div class="label">דקות</div>
                    </div>
                    <div class="unit">
                        <div class="value" id="seconds">00</div>
                        <div class="label">שניות</div>
                    </div>
                </div>

                <div class="done-message" id="doneMessage">🎉 הגיע היום! בהצלחה במעבר! 🎉</div>

                <div class="center-meta">
                    <span class="target-date">היעד: 24.09.2026, 06:00</span>
                    <span class="sync-status" id="syncStatus"></span>
                </div>

                <button type="button" id="exportPdfBtn" class="export-btn">📄 ייצוא סיכום PDF</button>
            </div>

            <div class="timeline-header">
                <span>📅 לוח שנה - שכבה י׳ תשפ״ז</span>
                <button type="button" id="timelineRefreshBtn" class="tl-refresh-btn" title="רענן מהגיליון החי">🔄</button>
            </div>
            <div class="tl-sync-status" id="timelineSyncStatus"></div>
            <div class="timeline-wrap" id="timelineWrap"></div>
        </div>

        <div class="task-column" data-key="housework">
            <h2>עבודות בית <span class="task-count"></span></h2>
            <div class="add-task">
                <input type="text" placeholder="משימה חדשה..." maxlength="200">
                <button type="button">➕</button>
            </div>
            <ul class="task-list"></ul>
        </div>
    </div>

    <!-- מוצג רק בעת הדפסה / ייצוא PDF - מוזן דינמית ע"י buildReport() -->
    <div class="print-report" id="printReport"></div>

    <script>
        // התאריך והשעה של המעבר: 24.09.2026, 06:00 לפי שעון ישראל (קיץ, UTC+3)
        // הכתיבה עם היסט מפורש (+03:00) מבטיחה שהספירה תהיה מדויקת
        // גם אם הדף נפתח ממכשיר שנמצא באזור זמן אחר
        const targetDate = new Date('2026-09-24T06:00:00+03:00');

        function updateCountdown() {
            const now = new Date();
            const diff = targetDate.getTime() - now.getTime();

            const countdownEl = document.getElementById('countdown');
            const doneEl = document.getElementById('doneMessage');

            if (diff <= 0) {
                countdownEl.style.display = 'none';
                doneEl.style.display = 'block';
                return;
            }

            const totalSeconds = Math.floor(diff / 1000);
            const days = Math.floor(totalSeconds / 86400);
            const hours = Math.floor((totalSeconds % 86400) / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);

        // ---- טבלת משימות, מסונכרנת בענן דרך Firebase Realtime Database ----
        // localStorage משמש כקאש מקומי מיידי (טעינה מהירה + עבודה גם בלי אינטרנט);
        // Firebase הוא "מקור האמת" שמסנכרן בין כל המכשירים בזמן אמת.
        const FIREBASE_BASE = 'https://timer-4672a-default-rtdb.europe-west1.firebasedatabase.app';
        const FIREBASE_APP_PATH = 'app-1b3c84cf218410393163a85b';

        function firebaseUrl(key) {
            return `${FIREBASE_BASE}/${FIREBASE_APP_PATH}/${key}.json`;
        }

        function readLocalCache(key) {
            try {
                const raw = localStorage.getItem('tasks-' + key);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                return [];
            }
        }

        // מצב חי בזיכרון - נטען מהקאש המקומי מיד, ומתעדכן מ-Firebase ברגע שהחיבור מגיע
        const tasksState = {
            tasks: readLocalCache('tasks'),
            housework: readLocalCache('housework')
        };

        function loadTasks(key) {
            return tasksState[key] || [];
        }

        function saveTasks(key, tasks) {
            tasksState[key] = tasks;
            localStorage.setItem('tasks-' + key, JSON.stringify(tasks));

            fetch(firebaseUrl(key), {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(tasks)
            }).catch(err => {
                console.error('סנכרון לענן נכשל (נשמר מקומית בלבד):', err);
                setSyncStatus(false);
            });
        }

        function renderTasks(column) {
            const key = column.dataset.key;
            const listEl = column.querySelector('.task-list');
            const countEl = column.querySelector('.task-count');
            const tasks = loadTasks(key);

            const openCount = tasks.filter(t => !t.done).length;
            if (countEl) {
                countEl.textContent = tasks.length ? `(${openCount}/${tasks.length})` : '';
            }

            // משימות שבוצעו יורדות לסוף הרשימה
            const sorted = [...tasks].sort((a, b) => Number(a.done) - Number(b.done));

            listEl.innerHTML = '';

            if (sorted.length === 0) {
                const hint = document.createElement('li');
                hint.className = 'empty-hint';
                hint.textContent = 'אין משימות עדיין — הוסיפו למעלה ⬆';
                listEl.appendChild(hint);
                return;
            }

            sorted.forEach(task => {
                const li = document.createElement('li');
                if (task.done) li.classList.add('done');

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = task.done;
                checkbox.addEventListener('change', () => {
                    task.done = checkbox.checked;
                    saveTasks(key, tasks);
                    renderTasks(column);
                });

                // --- גוף המשימה: שורת הטקסט + כפתור הערה, ומתחתיה ההערה עצמה (אם יש) ---
                const body = document.createElement('div');
                body.className = 'task-body';

                const row = document.createElement('div');
                row.className = 'task-row';

                const span = document.createElement('span');
                span.className = 'task-text';
                span.textContent = task.text;

                const noteBtn = document.createElement('button');
                noteBtn.type = 'button';
                noteBtn.className = 'note-btn';
                const hasNote = !!(task.note && task.note.trim());
                if (hasNote) noteBtn.classList.add('has-note');
                noteBtn.textContent = hasNote ? '✎' : '+';
                noteBtn.title = hasNote ? 'ערוך הערה' : 'הוסף הערה';

                row.appendChild(span);
                row.appendChild(noteBtn);
                body.appendChild(row);

                if (hasNote) {
                    const noteText = document.createElement('div');
                    noteText.className = 'task-note-text';
                    noteText.textContent = task.note;
                    noteText.title = 'לחצו לעריכת ההערה';
                    noteText.addEventListener('click', () => startNoteEdit(body, task, key, tasks, column));
                    body.appendChild(noteText);
                }

                noteBtn.addEventListener('click', () => startNoteEdit(body, task, key, tasks, column));

                const deleteBtn = document.createElement('button');
                deleteBtn.type = 'button';
                deleteBtn.className = 'delete-task';
                deleteBtn.textContent = '✕';
                deleteBtn.title = 'מחק משימה';
                deleteBtn.addEventListener('click', () => {
                    if (!confirm(`למחוק את "${task.text}"? לא ניתן לשחזר.`)) return;

                    const idx = tasks.indexOf(task);
                    if (idx > -1) tasks.splice(idx, 1);
                    saveTasks(key, tasks);
                    renderTasks(column);
                });

                li.appendChild(checkbox);
                li.appendChild(body);
                li.appendChild(deleteBtn);
                listEl.appendChild(li);
            });
        }

        // פותח שדה עריכה מקומי להערה של משימה ספציפית, בלי לרנדר מחדש את כל הרשימה.
        // Enter לבד שומר, Shift+Enter מוריד שורה בתוך ההערה, Escape מבטל.
        function startNoteEdit(body, task, key, tasks, column) {
            body.innerHTML = '';

            const input = document.createElement('textarea');
            input.className = 'note-input';
            input.maxLength = 6000;
            input.rows = 1;
            input.value = task.note || '';
            input.placeholder = 'הערה... (Shift+Enter לשורה חדשה)';

            const autoResize = () => {
                input.style.height = 'auto';
                input.style.height = input.scrollHeight + 'px';
            };

            let cancelled = false;

            const commit = () => {
                if (cancelled) return;
                task.note = input.value.trim();
                saveTasks(key, tasks);
                renderTasks(column);
            };

            input.addEventListener('input', autoResize);

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault(); // מונע ירידת שורה - Enter לבד שומר
                    input.blur();
                } else if (e.key === 'Escape') {
                    const originalNote = task.note || '';
                    const hasUnsavedChanges = input.value.trim() !== originalNote.trim();

                    // אזהרה לפני מחיקת שינויים שלא נשמרו - רק אם באמת יש מה לאבד
                    if (hasUnsavedChanges && !confirm('יש שינויים שלא נשמרו בהערה. לבטל ולאבד אותם?')) {
                        return;
                    }

                    cancelled = true;
                    renderTasks(column);
                }
            });
            input.addEventListener('blur', commit);

            body.appendChild(input);
            autoResize();
            input.focus();
        }

        function addTask(column) {
            const key = column.dataset.key;
            const input = column.querySelector('.add-task input');
            const text = input.value.trim();
            if (!text) return;

            const tasks = loadTasks(key);
            tasks.push({ text, done: false });
            saveTasks(key, tasks);
            input.value = '';
            renderTasks(column);
        }

        document.querySelectorAll('.task-column').forEach(column => {
            const button = column.querySelector('.add-task button');
            const input = column.querySelector('.add-task input');

            button.addEventListener('click', () => addTask(column));
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') addTask(column);
            });

            renderTasks(column);
        });

        // ---- סנכרון חי בין מכשירים (Firebase Realtime Database) ----
        function setSyncStatus(ok, connecting) {
            const el = document.getElementById('syncStatus');
            if (!el) return;
            if (connecting) {
                el.textContent = '☁️ מתחבר לסנכרון...';
            } else if (ok) {
                el.textContent = '☁️ מסונכרן בין המכשירים';
            } else {
                el.textContent = '⚠️ לא מחובר לסנכרון - עובד מקומית';
            }
        }

        // מונע דריסת עריכה פעילה (הקלדת משימה/הערה) כשמגיע עדכון מרחוק ממכשיר אחר
        function isEditing(column) {
            const noteInput = column.querySelector('.note-input');
            if (noteInput) return true;
            const addInput = column.querySelector('.add-task input');
            return document.activeElement === addInput && addInput.value.trim() !== '';
        }

        function connectSync(key, column) {
            let es;
            let firstEvent = true;

            try {
                es = new EventSource(firebaseUrl(key));
            } catch (e) {
                setSyncStatus(false);
                return;
            }

            const applyRemoteValue = (value) => {
                const list = Array.isArray(value) ? value : (value ? Object.values(value) : []);
                tasksState[key] = list;
                localStorage.setItem('tasks-' + key, JSON.stringify(list));
                if (!isEditing(column)) {
                    renderTasks(column);
                }
            };

            es.addEventListener('put', (e) => {
                setSyncStatus(true);
                try {
                    const parsed = JSON.parse(e.data);
                    const remoteIsEmpty = !parsed.data || (Array.isArray(parsed.data) && parsed.data.length === 0);

                    // בהתחברות הראשונה: אם בענן עוד אין כלום אבל יש כבר משימות מקומיות
                    // (למשל שנוספו לפני שהוגדר הסנכרון) - מעלים אותן לענן במקום למחוק אותן
                    if (firstEvent && remoteIsEmpty && tasksState[key] && tasksState[key].length) {
                        saveTasks(key, tasksState[key]);
                    } else {
                        applyRemoteValue(parsed.data);
                    }
                    firstEvent = false;
                } catch (err) {
                    console.error('שגיאה בפענוח עדכון מ-Firebase:', err);
                }
            });

            // "patch" מגיע בעדכונים חלקיים - אצלנו כל שמירה כותבת את הרשימה כולה,
            // אז אם בכל זאת מתקבל patch (למשל מעריכה ידנית בקונסולת Firebase), פשוט נטען מחדש
            es.addEventListener('patch', () => {
                fetch(firebaseUrl(key))
                    .then(r => r.json())
                    .then(applyRemoteValue)
                    .catch(() => {});
            });

            es.onerror = () => {
                setSyncStatus(false);
            };
        }

        setSyncStatus(false, true);
        connectSync('tasks', document.querySelector('.task-column[data-key="tasks"]'));
        connectSync('housework', document.querySelector('.task-column[data-key="housework"]'));

        // ---- ייצוא סיכום PDF (דרך דיאלוג ההדפסה של הדפדפן - "שמור כ-PDF") ----
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function getCountdownParts() {
            const diff = targetDate.getTime() - new Date().getTime();
            if (diff <= 0) return null;
            const totalSeconds = Math.floor(diff / 1000);
            return {
                days: Math.floor(totalSeconds / 86400),
                hours: Math.floor((totalSeconds % 86400) / 3600),
                minutes: Math.floor((totalSeconds % 3600) / 60)
            };
        }

        function buildInsights(tasksData, houseworkData, parts) {
            const insights = [];

            if (parts) {
                insights.push(`נותרו ${parts.days} ימים ו-${parts.hours} שעות עד המעבר.`);
            } else {
                insights.push('🎉 תאריך המעבר כבר הגיע!');
            }

            const tOpen = tasksData.filter(t => !t.done).length;
            const tDone = tasksData.length - tOpen;
            const hOpen = houseworkData.filter(t => !t.done).length;
            const hDone = houseworkData.length - hOpen;
            const totalOpen = tOpen + hOpen;
            const totalDone = tDone + hDone;
            const totalAll = tasksData.length + houseworkData.length;

            if (totalAll === 0) {
                insights.push('עדיין לא נוספו משימות או עבודות בית.');
                return insights;
            }

            const pct = Math.round((totalDone / totalAll) * 100);
            insights.push(`בסך הכל הושלמו ${totalDone} מתוך ${totalAll} פריטים (${pct}%).`);

            if (tasksData.length) {
                insights.push(`משימות: ${tDone}/${tasksData.length} הושלמו (${Math.round((tDone / tasksData.length) * 100)}%).`);
            }
            if (houseworkData.length) {
                insights.push(`עבודות בית: ${hDone}/${houseworkData.length} הושלמו (${Math.round((hDone / houseworkData.length) * 100)}%).`);
            }

            if (tOpen !== hOpen && tOpen > 0 && hOpen > 0) {
                const bigger = hOpen > tOpen ? 'עבודות בית' : 'משימות';
                const biggerCount = Math.max(tOpen, hOpen);
                insights.push(`נשארו יותר פריטים פתוחים ב"${bigger}" (${biggerCount}) — אולי שווה להתמקד שם קודם.`);
            }

            if (parts && parts.days <= 14 && totalOpen > 0) {
                insights.push(`⚠️ פחות משבועיים למעבר ועדיין יש ${totalOpen} פריטים פתוחים — כדאי להתחיל לתעדף.`);
            }

            if (totalOpen === 0) {
                insights.push('🎉 כל הפריטים הושלמו — מוכנים למעבר!');
            }

            return insights;
        }

        function buildTaskListHtml(tasks) {
            if (!tasks.length) {
                return '<div class="print-empty">אין פריטים ברשימה הזו</div>';
            }
            const sorted = [...tasks].sort((a, b) => Number(a.done) - Number(b.done));
            const rows = sorted.map(t => {
                const box = t.done ? '☑' : '☐';
                const noteHtml = (t.note && t.note.trim())
                    ? `<div class="note">${escapeHtml(t.note)}</div>`
                    : '';
                return `<li class="${t.done ? 'done' : ''}">
                    <span class="box">${box}</span>
                    <div class="body">
                        <div class="task-title">${escapeHtml(t.text)}</div>
                        ${noteHtml}
                    </div>
                </li>`;
            }).join('');
            return `<ul class="print-task-list">${rows}</ul>`;
        }

        function buildReport() {
            const tasksData = loadTasks('tasks');
            const houseworkData = loadTasks('housework');
            const parts = getCountdownParts();
            const insights = buildInsights(tasksData, houseworkData, parts);

            const countdownHtml = parts ? `
                <div class="print-countdown">
                    <div class="unit"><div class="value">${String(parts.days).padStart(2, '0')}</div><div class="label">ימים</div></div>
                    <div class="unit"><div class="value">${String(parts.hours).padStart(2, '0')}</div><div class="label">שעות</div></div>
                    <div class="unit"><div class="value">${String(parts.minutes).padStart(2, '0')}</div><div class="label">דקות</div></div>
                </div>` : '';

            const generatedStr = new Date().toLocaleString('he-IL', { dateStyle: 'long', timeStyle: 'short' });

            const report = document.getElementById('printReport');
            report.innerHTML = `
                <h1>עוברים לאבן יהודה 🏡</h1>
                <div class="print-subtitle">סיכום שהופק ב-${generatedStr} | יעד המעבר: 24.09.2026, 06:00</div>

                ${countdownHtml}

                <section>
                    <h2>💡 תובנות</h2>
                    <div class="insights-box">
                        <ul>${insights.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ul>
                    </div>
                </section>

                <section>
                    <h2>משימות</h2>
                    ${buildTaskListHtml(tasksData)}
                </section>

                <section>
                    <h2>עבודות בית</h2>
                    ${buildTaskListHtml(houseworkData)}
                </section>

                <div class="print-footer">נוצר אוטומטית מתוך "עוברים לאבן יהודה"</div>
            `;
        }

        document.getElementById('exportPdfBtn').addEventListener('click', () => {
            buildReport();
            window.print();
        });

 מועד ב - לשון (אירועים כלליים)"]],["06/07/2027","שלישי",["בגרות מועד ב - אנגלית אווטר (אירועים כלליים)"]],["07/07/2027","רביעי",["בגרות מועד ב - אנגלית (אירועים כלליים)"]],["08/07/2027","חמישי",["בגרות מועד ב - מתמטיקה (אירועים כלליים)"]]];

        function parseSheetDate(str) {
            const [d, m, y] = str.split('/').map(Number);
            return new Date(y, m - 1, d);
        }

        function monthKeyOf(date) {
            return date.getFullYear() + '-' + date.getMonth();
        }

        // אילו חודשים פתוחים כרגע (Set של מפתחות 'YYYY-M'). נשאר null עד הבנייה הראשונה,
        // ואז נשמר בין רענונים (כולל סנכרון חי מהגיליון) כדי לא לאבד למשתמש מה שהוא פתח/סגר ידנית
        let openMonths = null;

        function buildTimeline() {
            const wrap = document.getElementById('timelineWrap');
            if (!wrap) return;

            if (!TIMELINE_DATA.length) {
                wrap.innerHTML = '<div class="tl-empty">אין נתוני לוח שנה</div>';
                return;
            }

            const HEBREW_MONTHS = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            // הרשומה הראשונה שתאריכה עדיין לא עבר - "הקרוב ביותר", ומשמשת גם עוגן לגלילה אוטומטית
            const nextIndex = TIMELINE_DATA.findIndex(([dateStr]) => parseSheetDate(dateStr) >= today);

            // ברירת מחדל: רק החודש הנוכחי והחודש הבא פתוחים. נקבע פעם אחת בלבד -
            // פתיחה/סגירה ידנית של המשתמש לא נדרסת ברענונים הבאים
            if (openMonths === null) {
                openMonths = new Set();
                openMonths.add(monthKeyOf(today));
                openMonths.add(monthKeyOf(new Date(today.getFullYear(), today.getMonth() + 1, 1)));
            }

            // קיבוץ הרשומות לפי חודש, בסדר כרונולוגי
            const groups = [];
            let currentGroup = null;

            TIMELINE_DATA.forEach(([dateStr, dayName, items], i) => {
                const d = parseSheetDate(dateStr);
                const monthKey = monthKeyOf(d);

                if (!currentGroup || currentGroup.key !== monthKey) {
                    currentGroup = { key: monthKey, label: `${HEBREW_MONTHS[d.getMonth()]} ${d.getFullYear()}`, entriesHtml: [] };
                    groups.push(currentGroup);
                }

                const isNext = i === nextIndex;
                const isPast = !isNext && (nextIndex === -1 || i < nextIndex);
                const stateClass = isNext ? 'is-next' : (isPast ? 'is-past' : '');

                const dd = String(d.getDate()).padStart(2, '0');
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const itemsHtml = items.map(it => `<li>${escapeHtml(it)}</li>`).join('');

                currentGroup.entriesHtml.push(`
                    <div class="tl-entry ${stateClass}">
                        <div class="tl-rail"></div>
                        <div class="tl-content">
                            <div class="tl-date">${dd}.${mm} <span class="tl-day">${escapeHtml(dayName)}</span></div>
                            <ul class="tl-items">${itemsHtml}</ul>
                        </div>
                    </div>`);
            });

            wrap.innerHTML = groups.map(g => {
                const isOpen = openMonths.has(g.key);
                return `
                    <div class="tl-month-group ${isOpen ? 'open' : ''}" data-month-key="${g.key}">
                        <button type="button" class="tl-month-header">
                            <span>${g.label}</span>
                            <span class="tl-month-arrow">${isOpen ? '▾' : '▸'}</span>
                        </button>
                        <div class="tl-month-content">${g.entriesHtml.join('')}</div>
                    </div>`;
            }).join('');

            // לחיצה על כותרת חודש פותחת/סוגרת אותו, ושומרת את הבחירה ל-openMonths
            wrap.querySelectorAll('.tl-month-header').forEach(btn => {
                btn.addEventListener('click', () => {
                    const group = btn.closest('.tl-month-group');
                    const key = group.dataset.monthKey;
                    const willOpen = !group.classList.contains('open');

                    group.classList.toggle('open', willOpen);
                    btn.querySelector('.tl-month-arrow').textContent = willOpen ? '▾' : '▸';

                    if (willOpen) openMonths.add(key);
                    else openMonths.delete(key);
                });
            });

            // גלילה אוטומטית כדי שהאירוע הקרוב ביותר יופיע בראש התצוגה עם פתיחת הדף
            // (עובד כי החודש שלו פתוח כברירת מחדל - הוא החודש הנוכחי או הבא)
            const nextEl = wrap.querySelector('.tl-entry.is-next');
            if (nextEl) {
                wrap.scrollTop = Math.max(0, nextEl.offsetTop - 10);
            }
        }

        buildTimeline();

        // ---- סנכרון חי מול הגיליון (Google Sheets) - JSONP, בלי צורך בשרת/מפתח ----
        const SHEET_ID = '13_c30oIvqdOU3BfFSKnXzAAeG1qj7dNrJAEQPvpLwWY';
        const SHEET_GID = '0';

        function fetchLiveTimelineFromSheet() {
            return new Promise((resolve, reject) => {
                const callbackName = '__tlCb_' + Date.now();
                const script = document.createElement('script');

                const cleanup = () => {
                    delete window[callbackName];
                    script.remove();
                };

                window[callbackName] = (response) => {
                    cleanup();
                    resolve(response);
                };

                script.onerror = () => {
                    cleanup();
                    reject(new Error('טעינת הסקריפט מהגיליון נכשלה'));
                };

                // range=A4:Q מדלג ישירות על 3 שורות הכותרת של הגיליון (headers=0 - בלי זיהוי כותרות אוטומטי)
                script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${SHEET_GID}&range=A4:Q&headers=0&tqx=out:json;responseHandler:${callbackName}`;
                document.body.appendChild(script);
            });
        }

        // תאים שהם מסוג "תאריך" אמיתי בגיליון חוזרים מ-gviz כמחרוזת "Date(YYYY,M,D)"
        // (M הוא אינדקס חודש שמתחיל מ-0) במקום כטקסט המוצג בתא - ממירים לפורמט dd/mm/yyyy האחיד שלנו
        function normalizeGvizDate(raw) {
            const m = /^Date\((\d+),(\d+),(\d+)\)$/.exec(raw);
            if (!m) return raw;
            const year = m[1];
            const month = String(Number(m[2]) + 1).padStart(2, '0');
            const day = String(Number(m[3])).padStart(2, '0');
            return `${day}/${month}/${year}`;
        }

        // תיוג כל עמודת תוכן (החל מעמודה C בגיליון) לפי מקורה, כדי לציין בסוגריים ליד כל אירוע מאיפה הוא נלקח
        const COLUMN_LABELS = [
            'שבתות פנימיה',              // C
            'שלישי לומד',                // D
            'אירועים כלליים',            // E
            'שכבה ט',                    // F
            'שכבה י',                    // G
            'שכבה י - בגרויות מורחבות',  // H
            'שכבה י - שח"ר',             // I
            'שכבה י - נעל"ה',            // J
            'שכבה יא - בגרויות מורחבות', // K
            'שכבה יא - שח"ר',            // L
            'שכבה יא - נעל"ה',           // M
            'שכבה יב - בגרויות מורחבות', // N
            'שכבה יב - שח"ר',            // O
            'שכבה יב - נעל"ה'            // P
        ];

        // מציגים רק את מה שקשור לשכבה י: העמודה הכללית/בית ספרית (חגים, ימי חינוך וכו')
        // ועמודות שכבה י עצמה. כל שאר העמודות (שבתות פנימיה, שלישי לומד, שכבות ט/יא/יב) מוסתרות.
        const RELEVANT_LABELS = new Set(['אירועים כלליים', 'שכבה י', 'שכבה י - בגרויות מורחבות', 'שכבה י - שח"ר', 'שכבה י - נעל"ה']);

        function parseGvizResponse(response) {
            const rows = (response.table && response.table.rows) || [];
            const result = [];

            rows.forEach(row => {
                const cells = row.c || [];
                const dateCell = cells[0];
                if (!dateCell || dateCell.v == null || String(dateCell.v).trim() === '') return;

                const date = normalizeGvizDate(String(dateCell.v).trim());
                const day = (cells[1] && cells[1].v != null) ? String(cells[1].v).trim() : '';

                const seen = new Set();
                const items = [];
                for (let i = 2; i < cells.length; i++) {
                    const label = COLUMN_LABELS[i - 2];
                    if (!label || !RELEVANT_LABELS.has(label)) continue;

                    const cell = cells[i];
                    if (!cell || cell.v == null) continue;
                    const text = String(cell.v).trim();
                    if (text && !seen.has(text)) {
                        seen.add(text);
                        items.push(`${text} (${label})`);
                    }
                }

                if (items.length) {
                    result.push([date, day, items]);
                }
            });

            return result;
        }

        async function refreshTimelineFromSheet(manual) {
            const statusEl = document.getElementById('timelineSyncStatus');
            const btn = document.getElementById('timelineRefreshBtn');

            if (btn) btn.classList.add('spinning');
            if (statusEl && manual) statusEl.textContent = 'מרענן מהגיליון...';

            try {
                const response = await fetchLiveTimelineFromSheet();
                const parsed = parseGvizResponse(response);

                if (parsed.length) {
                    TIMELINE_DATA = parsed;
                    buildTimeline();
                    if (statusEl) {
                        const now = new Date();
                        statusEl.textContent = `✓ עודכן מהגיליון החי (${now.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' })})`;
                    }
                } else if (statusEl) {
                    statusEl.textContent = manual ? '⚠️ לא נמצאו נתונים בגיליון' : '';
                }
            } catch (err) {
                console.error('שגיאה בטעינת לוח השנה מהגיליון החי:', err);
                if (statusEl) {
                    statusEl.textContent = '⚠️ לא הצלחתי להתחבר לגיליון - מוצג העותק השמור';
                }
            } finally {
                if (btn) btn.classList.remove('spinning');
            }
        }

        document.getElementById('timelineRefreshBtn').addEventListener('click', () => refreshTimelineFromSheet(true));

        // ניסיון סנכרון שקט מיד עם טעינת הדף, כך שהלוח מתעדכן מהגיליון בלי שצריך ללחוץ על כלום
        refreshTimelineFromSheet(false);
    </script>

</body>
</html>

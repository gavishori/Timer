<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>GREMSON - מחשבון שותפות</title>
    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            background-attachment: fixed;
            color: #fff;
        }

        .gavish-hub {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 60;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            text-decoration: none;
            background: rgba(15, 31, 61, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
        }

        .page {
            max-width: 1500px;
            margin: 0 auto;
            padding: 22px 16px 40px;
        }

        .page-head {
            text-align: center;
            margin-bottom: 18px;
        }

        .page-head h1 {
            margin: 0;
            font-size: clamp(1.5rem, 3vw, 2.2rem);
            letter-spacing: 1.5px;
        }

        .page-head .sub {
            margin-top: 4px;
            font-size: 0.95rem;
            color: #cfe0ff;
        }

        .gremson-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 18px;
            align-items: start;
        }

        /* הכותרות כאן הן רק כותרות - הקוביות תמיד פתוחות */
        .gremson-box .col-arrow { display: none; }
        .gremson-box .yield-header { pointer-events: none; font-size: 1.15rem; margin-bottom: 8px; }
        .gremson-box .invest-toggle { pointer-events: auto; }
        .gremson-box .invest-toggle .col-arrow { display: inline-block; }
        .gremson-box .yield-body { display: block; }
        .gremson-box.yield-calc { margin-top: 0; padding: 16px 18px; }

        @media (min-width: 900px) {
            .gremson-grid {
                grid-template-columns: minmax(300px, 400px) minmax(0, 1fr);
            }
        }

        /* ---- מחשבון תשואה ---- */
        .yield-calc {
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 10px 14px;
            margin-top: 10px;
        }

        .yield-header {
            margin: 0;
            font-size: 0.85rem;
            color: #cfe0ff;
            text-align: center;
            cursor: pointer;
            user-select: none;
        }

        .yield-header .col-arrow {
            display: inline-block;
            font-size: 0.7rem;
            margin-left: 2px;
        }

        .yield-header:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.5);
            outline-offset: 4px;
            border-radius: 8px;
        }

        .yield-body {
            margin-top: 12px;
        }

        .yield-calc.collapsed .yield-body {
            display: none;
        }

        .yield-field {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .yield-field label {
            flex: 0 0 84px;
            font-size: 0.7rem;
            color: #cfe0ff;
            line-height: 1.2;
        }

        .yield-input-wrap {
            position: relative;
            flex: 0 0 50%;
            min-width: 0;
        }

        .yield-input-wrap .currency {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            color: #888;
            font-size: 0.85rem;
            pointer-events: none;
        }

        .yield-field input {
            width: 100%;
            box-sizing: border-box;
            padding: 9px 26px 9px 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            font-size: 0.9rem;
            text-align: left;
            direction: ltr;
            appearance: textfield;
            -moz-appearance: textfield;
        }

        /* מסתיר את חצי ההגדלה/הקטנה הטבעיים של input[type=number] - הם היו מתנגשים עם סימן ה-₪ */
        .yield-field input::-webkit-outer-spin-button,
        .yield-field input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .yield-result {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            text-align: center;
        }

        .yield-result .yield-label {
            display: block;
            font-size: 0.7rem;
            color: #cfe0ff;
            margin-bottom: 2px;
        }

        .yield-result .yield-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #8bc34a;
        }

        .yield-formula {
            margin-top: 4px;
            font-size: 0.68rem;
            color: #9fb4dd;
            direction: ltr;
        }

        /* ---- מחשבון השקעה (שותפות) ---- */
        .invest-group-title {
            margin: 12px 0 8px 0;
            font-size: 0.7rem;
            font-weight: 700;
            color: #ffd166;
        }

        .invest-toggle {
            cursor: pointer;
            user-select: none;
            text-align: center;
        }

        .invest-toggle .col-arrow {
            display: inline-block;
            font-size: 0.7rem;
        }

        .invest-costs-total {
            color: #8bc34a;
            direction: ltr;
            unicode-bidi: isolate;
        }

        .yield-field input[readonly] {
            background: rgba(255, 255, 255, 0.6);
            color: #444;
            cursor: default;
        }

        .invest-costs-body[hidden] {
            display: none;
        }

        .invest-results {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }

        .invest-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
            padding: 6px 0;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.12);
        }

        .invest-row:last-of-type {
            border-bottom: none;
        }

        .invest-row .invest-label {
            font-size: 0.7rem;
            color: #cfe0ff;
            line-height: 1.3;
            flex: 1 1 auto;
        }

        .invest-row .invest-value {
            direction: ltr;
            text-align: left;
            font-size: 0.85rem;
            font-weight: 700;
            color: #8bc34a;
            flex: 0 0 auto;
            line-height: 1.3;
        }

        .invest-row .invest-value small {
            display: block;
            font-size: 0.65rem;
            font-weight: 400;
            color: #cfe0ff;
        }

        .invest-row .invest-value.negative {
            color: #ff6b6b;
        }

        .invest-note {
            margin-top: 8px;
            font-size: 0.62rem;
            color: #9fb4dd;
            line-height: 1.4;
        }


        @media (min-width: 821px) {
            .yield-calc.view-active .yield-body,
            .yield-calc.collapsed.view-active .yield-body {
                display: block;
                width: 100%;
                max-width: 720px;
                margin: 12px auto 0;
            }

            .yield-calc.view-active .yield-header {
                text-align: center;
            }

            /* ---- מחשבון השקעה גדול וברור: קלט מימין, תוצאות ככרטיסים משמאל ---- */
            #investCalc.view-active .yield-body {
                max-width: 1280px;
            }

            #investCalc.view-active .yield-header {
                font-size: 1.8rem;
                margin-bottom: 22px;
            }

            #investCalc.view-active .invest-layout {
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
                gap: 48px;
                align-items: start;
            }

            #investCalc.view-active .invest-group-title {
                font-size: 1.15rem;
                margin: 4px 0 16px 0;
                text-align: right;
            }

            #investCalc.view-active .invest-group-title:not(:first-child) {
                margin-top: 30px;
            }

            #investCalc.view-active .invest-toggle {
                pointer-events: none;
            }

            #investCalc.view-active .invest-toggle .invest-costs-total {
                float: left;
                font-size: 1.25rem;
                font-weight: 700;
            }

            #investCalc.view-active .invest-costs-body[hidden] {
                display: block;
            }

            #investCalc.view-active .yield-field {
                gap: 14px;
                margin-bottom: 9px;
            }

            #investCalc.view-active .yield-field label {
                flex: 0 0 170px;
                font-size: 1.05rem;
                color: #e3ebfb;
            }

            #investCalc.view-active .yield-input-wrap {
                flex: 1 1 auto;
            }

            #investCalc.view-active .yield-field input {
                font-size: 1.25rem;
                padding: 9px 38px 9px 16px;
                border-radius: 12px;
            }

            #investCalc.view-active .yield-input-wrap .currency {
                font-size: 1.1rem;
                right: 14px;
            }

            #investCalc.view-active .invest-results {
                margin-top: 0;
                padding-top: 0;
                border-top: none;
                display: flex;
                flex-direction: column;
                gap: 16px;
            }

            #investCalc.view-active .invest-row {
                background: rgba(255, 255, 255, 0.1);
                border: 1px solid rgba(255, 255, 255, 0.2);
                border-radius: 16px;
                padding: 20px 26px;
                align-items: center;
                gap: 18px;
            }

            #investCalc.view-active .invest-row:first-child {
                background: rgba(255, 255, 255, 0.16);
            }

            #investCalc.view-active .invest-row .invest-label {
                font-size: 1.15rem;
                line-height: 1.4;
                color: #e3ebfb;
            }

            #investCalc.view-active .invest-row .invest-value {
                font-size: 2.2rem;
                line-height: 1.15;
            }

            #investCalc.view-active .invest-row .invest-value small {
                font-size: 1.05rem;
                margin-top: 4px;
                color: #cfe0ff;
            }

            #investCalc.view-active .invest-note {
                font-size: 0.9rem;
                margin-top: 16px;
                text-align: center;
            }

        }

        /* iOS: מונע זום אוטומטי בהתמקדות בשדה */
        @media (max-width: 820px) {
            input { font-size: 16px !important; }
        }
    </style>
</head>
<body>
    <a id="gavishHub" class="gavish-hub" href="../home/" title="גביש - כל הפרויקטים" aria-label="גביש - כל הפרויקטים">💎</a>

    <div class="page">
        <div class="page-head">
            <h1>GREMSON 🤝</h1>
            <div class="sub">מחשבון שותפות והשקעות</div>
        </div>

        <div class="gremson-grid">
            <div class="yield-calc view-active gremson-box" id="yieldCalc">
                <h3 class="yield-header" role="button" tabindex="0" aria-expanded="false">
                    <span><span class="col-arrow">▸</span> 💰 מחשבון תשואה</span>
                </h3>
                <div class="yield-body">
                <div class="yield-field">
                    <label for="yieldPrice">מחיר קניית דירה</label>
                    <div class="yield-input-wrap">
                        <input type="number" id="yieldPrice" placeholder="1800000" min="0" step="1000">
                        <span class="currency">₪</span>
                    </div>
                </div>
                <div class="yield-field">
                    <label for="yieldRent">שכ"ד חודשי</label>
                    <div class="yield-input-wrap">
                        <input type="number" id="yieldRent" placeholder="5500" min="0" step="50">
                        <span class="currency">₪</span>
                    </div>
                </div>
                <div class="yield-result">
                    <span class="yield-label">תשואה שנתית</span>
                    <span class="yield-value" id="yieldResult">—</span>
                    <div class="yield-formula" id="yieldFormula"></div>
                </div>
                </div>
            </div>

            <div class="yield-calc view-active gremson-box" id="investCalc">
                <h3 class="yield-header" role="button" tabindex="0" aria-expanded="false">
                    <span><span class="col-arrow">▸</span> 🏗️ מחשבון השקעה</span>
                </h3>
                <div class="yield-body">
                <div class="invest-layout">
                <div class="invest-inputs">
                <div class="invest-group-title invest-toggle" id="investCostsToggle" role="button" tabindex="0" aria-expanded="true"><span class="col-arrow">▾</span> עלויות הפרויקט (בדולר) <span class="invest-costs-total" id="investCostsTotal"></span></div>
                <div class="invest-costs-body" id="investCostsBody">
                <div class="yield-field">
                    <label for="investBuild">עלות הבנייה</label>
                    <div class="yield-input-wrap">
                        <input type="number" id="investBuild" readonly tabindex="-1" placeholder="250000" min="0" step="1000">
                        <span class="currency">$</span>
                    </div>
                </div>
                <div class="yield-field">
                    <label for="investLand">קרקע</label>
                    <div class="yield-input-wrap">
                        <input type="number" id="investLand" readonly tabindex="-1" placeholder="30000" min="0" step="1000">
                        <span class="currency">$</span>
                    </div>
                </div>
                <div class="yield-field">
                    <label for="investFreddy">פרדי</label>
                    <div class="yield-input-wrap">
                        <input type="number" id="investFreddy" readonly tabindex="-1" placeholder="11000" min="0" step="100">
                        <span class="currency">$</span>
                    </div>
                </div>
                <div class="yield-field">
                    <label for="investLawyer">עו"ד אורי בר</label>
                    <div class="yield-input-wrap">
                        <input type="number" id="investLawyer" readonly tabindex="-1" placeholder="2000" min="0" step="100">
                        <span class="currency">$</span>
                    </div>
                </div>
                <div class="yield-field">
                    <label for="investSign">תשלום לדורי (חתימה)</label>
                    <div class="yield-input-wrap">
                        <input type="number" id="investSign" readonly tabindex="-1" placeholder="125" min="0" step="25">
                        <span class="currency">$</span>
                    </div>
                </div>
                </div>
                <div class="invest-group-title">הנחות לחישוב</div>
                <div class="yield-field">
                    <label for="investRate">שער הדולר</label>
                    <div class="yield-input-wrap">
                        <input type="number" id="investRate" placeholder="3.67" min="0" step="0.01">
                        <span class="currency">₪</span>
                    </div>
                </div>
                <div class="yield-field">
                    <label for="investProfitPct">אחוז רווח נדרש</label>
                    <div class="yield-input-wrap">
                        <input type="number" id="investProfitPct" placeholder="20" min="0" step="1">
                        <span class="currency">%</span>
                    </div>
                </div>
                <div class="yield-field">
                    <label for="investSale">מחיר מכירה</label>
                    <div class="yield-input-wrap">
                        <input type="number" id="investSale" placeholder="350000" min="0" step="1000">
                        <span class="currency">$</span>
                    </div>
                </div>
                <div class="yield-field">
                    <label for="investFee">ניכוי במכירה</label>
                    <div class="yield-input-wrap">
                        <input type="number" id="investFee" placeholder="10" min="0" step="1">
                        <span class="currency">%</span>
                    </div>
                </div>
                </div>
                <div class="invest-output">
                <div class="invest-results" id="investResults"></div>
                <div class="invest-note">הרווח = מחיר המכירה אחרי הניכוי פחות ההשקעה הכספית; אחוז הרווח הוא הרווח ביחס להשקעה.</div>
                </div>
                </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const FIREBASE_BASE = 'https://timer-4672a-default-rtdb.europe-west1.firebasedatabase.app';
        const FIREBASE_APP_PATH = 'app-1b3c84cf218410393163a85b';

        function firebaseUrl(key) {
            return `${FIREBASE_BASE}/${FIREBASE_APP_PATH}/${key}.json`;
        }

        (function initYieldCalculator() {
            const priceInput = document.getElementById('yieldPrice');
            const rentInput = document.getElementById('yieldRent');
            const resultEl = document.getElementById('yieldResult');
            const formulaEl = document.getElementById('yieldFormula');
            if (!priceInput || !rentInput || !resultEl) return;

            // פתיחה/סגירה בלחיצה על הכותרת (סגור כברירת מחדל, כמו מעקב הקילומטראז')
            const yieldBox = document.getElementById('yieldCalc');
            const yieldHeader = yieldBox.querySelector('.yield-header');
            const yieldArrow = yieldHeader.querySelector('.col-arrow');
            const toggleYield = () => {
                const willOpen = yieldBox.classList.contains('collapsed');
                yieldBox.classList.toggle('collapsed', !willOpen);
                yieldHeader.setAttribute('aria-expanded', String(willOpen));
                yieldArrow.textContent = willOpen ? '▾' : '▸';
            };
            yieldHeader.addEventListener('click', toggleYield);
            yieldHeader.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleYield();
                }
            });

            const STORAGE_KEY = 'yield-calc-values';

            function calculate() {
                const price = parseFloat(priceInput.value);
                const rent = parseFloat(rentInput.value);

                if (!price || price <= 0 || !rent || rent <= 0) {
                    resultEl.textContent = '—';
                    if (formulaEl) formulaEl.textContent = '';
                    return;
                }

                const annualYield = (rent * 12 / price) * 100;
                resultEl.textContent = `${annualYield.toFixed(2)}%`;

                // שורת הסבר: איך התוצאה חושבה, עם המספרים בפועל
                if (formulaEl) {
                    const fmt = n => n.toLocaleString('en-US');
                    formulaEl.textContent = `(${fmt(rent)} × 12) ÷ ${fmt(price)} × 100 = ${annualYield.toFixed(2)}%`;
                }
            }

            function loadYieldValues() {
                try {
                    return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                } catch (e) {
                    return null;
                }
            }

            function save() {
                const values = { price: priceInput.value, rent: rentInput.value, updatedAt: Date.now() };
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(values));
                } catch (e) {
                    // לא קריטי אם לא ניתן לשמור מקומית
                }

                // מסנכרן גם לענן, כדי שהערכים יופיעו גם בשאר המכשירים
                fetch(firebaseUrl('yield-calc'), {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(values)
                }).catch(err => {
                    console.error('סנכרון מחשבון התשואה לענן נכשל (נשמר מקומית בלבד):', err);
                });
            }

            // ברירות מחדל - רק אם המשתמש עוד לא שמר ערכים משלו
            priceInput.value = '3000000';
            rentInput.value = '8000';

            const saved = loadYieldValues();
            if (saved) {
                priceInput.value = saved.price || '3000000';
                rentInput.value = saved.rent || '8000';
            }

            [priceInput, rentInput].forEach(input => {
                input.addEventListener('input', () => {
                    calculate();
                    save();
                });
            });

            calculate();

            // סנכרון חי בין מכשירים: לעולם לא דורס שדה עם ערך אמיתי בגלל שהצד השני ריק -
            // אם רק לצד אחד יש ערך, משמרים אותו ודוחפים אותו הלאה לצד השני
            (function connectYieldSync() {
                let es;
                try {
                    es = new EventSource(firebaseUrl('yield-calc'));
                } catch (e) {
                    return;
                }

                function pickField(localVal, cloudVal) {
                    const cloudEmpty = cloudVal == null || cloudVal === '';
                    const localEmpty = localVal == null || localVal === '';
                    if (cloudEmpty && !localEmpty) return localVal;
                    if (!cloudEmpty) return cloudVal;
                    return localVal;
                }

                // מי שנערך לאחרונה בפועל (לפי updatedAt) מנצח כמקשה אחת - לא "מי שלא ריק",
                // כי "מי שלא ריק" גרם לכך שמכשיר ישן/רדום עם ערך ישן דרס לצמיתות עריכה
                // אמיתית וטרייה שנעשתה במכשיר אחר. אם אין חותמת זמן בכלל (נתון ישן), חוזרים
                // לשיטה הישנה כגיבוי בלבד.
                function mergeAndApply(cloudValues) {
                    const local = loadYieldValues() || {};
                    const cloud = cloudValues || {};
                    const localTime = local.updatedAt || 0;
                    const cloudTime = cloud.updatedAt || 0;

                    let merged;
                    if (cloudTime > localTime) {
                        merged = {
                            price: (cloud.price != null && cloud.price !== '') ? cloud.price : local.price,
                            rent: (cloud.rent != null && cloud.rent !== '') ? cloud.rent : local.rent,
                            updatedAt: cloudTime
                        };
                    } else if (localTime > cloudTime) {
                        merged = { price: local.price, rent: local.rent, updatedAt: localTime };
                    } else {
                        merged = {
                            price: pickField(local.price, cloud.price),
                            rent: pickField(local.rent, cloud.rent),
                            updatedAt: Math.max(localTime, cloudTime)
                        };
                    }

                    const changed = JSON.stringify(merged) !== JSON.stringify(cloud);

                    try {
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
                    } catch (e) {
                        // לא קריטי
                    }

                    if (merged.price) priceInput.value = merged.price;
                    if (merged.rent) rentInput.value = merged.rent;
                    calculate();

                    if (changed) {
                        fetch(firebaseUrl('yield-calc'), {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(merged)
                        }).catch(() => {});
                    }
                }

                es.addEventListener('put', (e) => {
                    try {
                        const parsed = JSON.parse(e.data);
                        mergeAndApply(parsed.data || {});
                    } catch (err) {
                        console.error('שגיאה בפענוח סנכרון מחשבון תשואה:', err);
                    }
                });

                es.addEventListener('patch', () => {
                    fetch(firebaseUrl('yield-calc'))
                        .then(r => r.json())
                        .then(cloudValues => mergeAndApply(cloudValues || {}))
                        .catch(() => {});
                });
            })();
        })();

        // ---- מחשבון השקעה (שותפות) - חישוב לפי עלויות הפרויקט, שער דולר, אחוז רווח נדרש ומחיר מכירה ----
        (function initInvestCalculator() {
            const box = document.getElementById('investCalc');
            const resultsEl = document.getElementById('investResults');
            if (!box || !resultsEl) return;

            // עלויות הפרויקט קבועות - לא ניתנות לעריכה ולא מסתנכרנות
            const FIXED_COSTS = [
                ['investBuild', 250000], ['investLand', 30000], ['investFreddy', 11000],
                ['investLawyer', 2000], ['investSign', 125]
            ];
            const FIELDS = [
                ['investRate', 3.67], ['investProfitPct', 20], ['investSale', 350000], ['investFee', 10]
            ];
            const STORAGE_KEY = 'invest-calc-values';
            const inputs = {};
            FIXED_COSTS.forEach(([id, val]) => {
                inputs[id] = document.getElementById(id);
                inputs[id].value = String(val);
            });
            FIELDS.forEach(([id]) => { inputs[id] = document.getElementById(id); });

            const header = box.querySelector('.yield-header');
            const arrow = header.querySelector('.col-arrow');
            const toggle = () => {
                const willOpen = box.classList.contains('collapsed');
                box.classList.toggle('collapsed', !willOpen);
                header.setAttribute('aria-expanded', String(willOpen));
                arrow.textContent = willOpen ? '▾' : '▸';
            };
            header.addEventListener('click', toggle);
            header.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggle();
                }
            });

            // רשימת העלויות נפתחת/נסגרת בלחיצה על הכותרת שלה (סגורה כברירת מחדל)
            const costsToggle = document.getElementById('investCostsToggle');
            const costsBody = document.getElementById('investCostsBody');
            const costsArrow = costsToggle.querySelector('.col-arrow');
            const toggleCosts = () => {
                const willOpen = costsBody.hidden;
                costsBody.hidden = !willOpen;
                costsToggle.setAttribute('aria-expanded', String(willOpen));
                costsArrow.textContent = willOpen ? '▾' : '▸';
            };
            costsToggle.addEventListener('click', toggleCosts);
            costsToggle.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleCosts();
                }
            });

            const num = (id) => {
                const v = parseFloat(inputs[id].value);
                return isNaN(v) ? 0 : v;
            };
            const usd = (n) => (n < 0 ? '-$' : '$') + Math.abs(Math.round(n)).toLocaleString('en-US');
            const nis = (n) => (n < 0 ? '-₪' : '₪') + Math.abs(Math.round(n)).toLocaleString('en-US');

            function row(label, mainValue, subValue, negative) {
                return `<div class="invest-row"><span class="invest-label">${label}</span>` +
                    `<span class="invest-value${negative ? ' negative' : ''}">${mainValue}${subValue ? `<small>${subValue}</small>` : ''}</span></div>`;
            }

            function calculate() {
                const invested = num('investBuild') + num('investLand') + num('investFreddy') + num('investLawyer') + num('investSign');
                const rate = num('investRate');
                const required = num('investProfitPct') / 100;
                const sale = num('investSale');
                const fee = num('investFee') / 100;

                document.getElementById('investCostsTotal').textContent = invested > 0 ? '· ' + usd(invested) : '';

                if (invested <= 0 || fee >= 1) {
                    resultsEl.innerHTML = '<div class="invest-note">הזינו עלויות כדי לראות חישוב</div>';
                    return;
                }

                const afterFee = 1 - fee;
                const nisOf = (usdAmount) => (rate > 0 ? nis(usdAmount * rate) : '');

                const requiredSale = invested * (1 + required) / afterFee;
                const profitAtRequired = invested * required;

                const profitAtSale = afterFee * sale - invested;
                const profitPctAtSale = (profitAtSale / invested) * 100;

                const maxInvest = afterFee * sale / (1 + required);
                const profitAtMax = maxInvest * required;

                const pctText = (required * 100).toFixed(0);
                resultsEl.innerHTML =
                    row('השקעה כספית (סך העלויות)', usd(invested), nisOf(invested)) +
                    row(`מחיר מכירה נדרש לרווח של ${pctText}%`, usd(requiredSale), `רווח ${usd(profitAtRequired)} · ${nisOf(profitAtRequired)}`) +
                    row(`רווח במחיר מכירה ${usd(sale)}`, usd(profitAtSale), `${profitPctAtSale.toFixed(2)}% · ${nisOf(profitAtSale)}`, profitAtSale < 0) +
                    row(`השקעה מקסימלית למכירה ב-${usd(sale)} ורווח ${pctText}%`, usd(maxInvest), `רווח ${usd(profitAtMax)} · ${nisOf(profitAtMax)}`);
            }

            function loadSaved() {
                try {
                    return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                } catch (e) {
                    return null;
                }
            }

            function currentValues() {
                const values = {};
                FIELDS.forEach(([id]) => { values[id] = inputs[id].value; });
                return values;
            }

            function save() {
                const values = Object.assign(currentValues(), { updatedAt: Date.now() });
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(values));
                } catch (e) {}
                fetch(firebaseUrl('invest-calc'), {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(values)
                }).catch(err => console.error('סנכרון מחשבון ההשקעה לענן נכשל (נשמר מקומית בלבד):', err));
            }

            FIELDS.forEach(([id, def]) => { inputs[id].value = String(def); });
            const saved = loadSaved();
            if (saved) {
                FIELDS.forEach(([id]) => {
                    if (saved[id] != null && saved[id] !== '') inputs[id].value = saved[id];
                });
            }

            FIELDS.forEach(([id]) => {
                inputs[id].addEventListener('input', () => {
                    calculate();
                    save();
                });
            });

            calculate();

            // סנכרון חי בין מכשירים - אותה שיטה כמו במחשבון התשואה: מי שנערך לאחרונה מנצח כמקשה אחת
            (function connectInvestSync() {
                let es;
                try {
                    es = new EventSource(firebaseUrl('invest-calc'));
                } catch (e) {
                    return;
                }

                const isEmpty = (v) => v == null || v === '';
                const pick = (localVal, cloudVal) => (!isEmpty(cloudVal) ? cloudVal : localVal);

                function mergeAndApply(cloudValues) {
                    const local = loadSaved() || {};
                    const cloud = cloudValues || {};
                    const localTime = local.updatedAt || 0;
                    const cloudTime = cloud.updatedAt || 0;

                    const merged = {};
                    FIELDS.forEach(([id]) => {
                        if (localTime > cloudTime) merged[id] = !isEmpty(local[id]) ? local[id] : cloud[id];
                        else merged[id] = pick(local[id], cloud[id]);
                    });
                    merged.updatedAt = Math.max(localTime, cloudTime);

                    if (!FIELDS.some(([id]) => !isEmpty(merged[id]))) return;

                    try {
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
                    } catch (e) {}

                    FIELDS.forEach(([id]) => {
                        if (!isEmpty(merged[id])) inputs[id].value = merged[id];
                    });
                    calculate();

                    if (JSON.stringify(merged) !== JSON.stringify(cloud)) {
                        fetch(firebaseUrl('invest-calc'), {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(merged)
                        }).catch(() => {});
                    }
                }

                es.addEventListener('put', (e) => {
                    try {
                        const parsed = JSON.parse(e.data);
                        mergeAndApply(parsed.data || {});
                    } catch (err) {
                        console.error('שגיאה בפענוח סנכרון מחשבון השקעה:', err);
                    }
                });

                es.addEventListener('patch', () => {
                    fetch(firebaseUrl('invest-calc'))
                        .then(r => r.json())
                        .then(cloudValues => mergeAndApply(cloudValues || {}))
                        .catch(() => {});
                });
            })();
        })();

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>גביש</title>
    <style>
        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
            background: radial-gradient(ellipse at 50% 40%, #2a5298 0%, #1e3c72 45%, #0f1f3d 100%);
        }

        #stage {
            position: fixed;
            inset: 0;
        }

        #stage canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: grab;
        }

        #stage canvas.dragging { cursor: grabbing; }
        #stage canvas.hovering { cursor: pointer; }

        .top {
            position: fixed;
            top: 22px;
            left: 0;
            right: 0;
            text-align: center;
            pointer-events: none;
            z-index: 2;
        }

        .top h1 {
            margin: 0;
            font-size: clamp(1.4rem, 3.2vw, 2.4rem);
            letter-spacing: 1px;
            text-shadow: 0 2px 18px rgba(120, 170, 255, 0.55);
        }

        .top .subtitle {
            margin-top: 4px;
            font-size: 0.95rem;
            color: #cfe0ff;
        }

        .top .status {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 16px;
            font-size: 0.85rem;
            color: #ffd166;
            background: rgba(255, 209, 102, 0.12);
            border: 1px solid rgba(255, 209, 102, 0.35);
            border-radius: 999px;
        }

        #tip {
            position: fixed;
            z-index: 3;
            pointer-events: none;
            padding: 8px 14px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #10244a;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
            transform: translate(-50%, -140%);
            opacity: 0;
            transition: opacity 0.12s;
            white-space: nowrap;
        }

        #tip.show { opacity: 1; }

        .dock {
            position: fixed;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            z-index: 2;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: min(980px, calc(100vw - 24px));
        }

        .dock a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 14px;
            backdrop-filter: blur(8px);
            transition: background 0.15s, transform 0.15s;
        }

        .dock a:hover, .dock a.active, .dock a:focus-visible {
            background: rgba(255, 255, 255, 0.24);
            transform: translateY(-3px);
            outline: none;
        }

        .dock a .ico { font-size: 1.15rem; }

        .fallback {
            display: none;
            position: fixed;
            top: 40%;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 1rem;
            color: #cfe0ff;
        }

        @media (max-width: 600px) {
            .dock { gap: 6px; bottom: 12px; }
            .dock a { padding: 8px 11px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <div id="stage"></div>

    <div class="top">
        <h1>גביש 💎</h1>
        <div class="subtitle">כל הפרויקטים במקום אחד</div>
        <div class="status" id="status"></div>
    </div>

    <div id="tip"></div>

    <nav class="dock" id="dock" aria-label="פרויקטים"></nav>

    <div class="fallback" id="fallback">לא ניתן לטעון את הגביש התלת-ממדי - אפשר להשתמש בכפתורים למטה.</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // כל גביש בצביר = פרויקט. הקישורים לפי הכתובות שבהן כל פרויקט מתפרסם.
        // pos/h/r = מיקום, גובה ורדיוס; lean = זווית הטיה החוצה (רדיאנים)
        const FACETS = [
            { id: 'timer',  ico: '🏡', label: 'עוברים לאבן יהודה',      href: '../',                                        color: 0x4f8cff, pos: [0, 0, 0],        h: 3.4, r: 0.66, lean: 0 },
            { id: 'house',  ico: '📊', label: 'ניהול הוצאות והכנסות',    href: 'https://gavishori.github.io/Manage_House/',  color: 0xffc247, pos: [1.35, 0, 0.35],   h: 2.5, r: 0.52, lean: 0.34 },
            { id: 'ziv',    ico: '🏢', label: 'פיכמן 5 - הכנסות והוצאות', href: 'https://gavishori.github.io/ZIV/',           color: 0x35c2c9, pos: [0.4, 0, 1.45],    h: 2.1, r: 0.46, lean: 0.4 },
            { id: 'radio',  ico: '📻', label: 'רדיו נקי',                href: 'https://gavishori.github.io/Radio/',         color: 0x9a6cff, pos: [-1.3, 0, 0.55],   h: 2.7, r: 0.5, lean: 0.32 },
            { id: 'lappid', ico: '🚑', label: 'חפ"ק לפיד',               href: 'https://gavishori.github.io/Lappid_Rescue/', color: 0xff7a59, pos: [-0.55, 0, -1.4],  h: 2.25, r: 0.48, lean: 0.38 }
        ];

        // ---- סטטוס המעבר (בלי שרת - מחושב מהתאריך) ----
        (function status() {
            const target = new Date('2026-09-28T08:00:00+03:00');
            const days = Math.floor(Math.abs(Date.now() - target) / 86400000);
            document.getElementById('status').textContent = Date.now() >= target
                ? `🎉 באבן יהודה כבר ${days} ימים`
                : `⏳ ${days} ימים עד המעבר`;
        })();

        // ---- כפתורי הפרויקטים (תמיד קיימים - גם נגישות וגם גיבוי בלי WebGL) ----
        const dock = document.getElementById('dock');
        const dockLinks = FACETS.map(f => {
            const a = document.createElement('a');
            a.href = f.href;
            a.style.borderColor = '#' + f.color.toString(16).padStart(6, '0') + '99';
            a.innerHTML = `<span class="ico">${f.ico}</span><span>${f.label}</span>`;
            dock.appendChild(a);
            return a;
        });

        if (typeof THREE === 'undefined') {
            document.getElementById('fallback').style.display = 'block';
        } else {
            initCrystal();
        }

        // גביש אחד: מנסרה משושה עם קצה מחודד למעלה ובסיס שטוח, בנויה ממשולשים
        function crystalGeometry(r, h) {
            const cap = r * 1.5;
            const v = [];
            const ring = [];
            for (let k = 0; k < 6; k++) {
                const a = (k * Math.PI) / 3 + Math.PI / 6;
                ring.push([r * Math.cos(a), r * Math.sin(a)]);
            }
            for (let k = 0; k < 6; k++) {
                const p = ring[k], q = ring[(k + 1) % 6];
                v.push(p[0], 0, p[1],  q[0], 0, q[1],  q[0], h, q[1]);
                v.push(p[0], 0, p[1],  q[0], h, q[1],  p[0], h, p[1]);
                v.push(p[0], h, p[1],  q[0], h, q[1],  0, h + cap, 0);
                v.push(q[0], 0, q[1],  p[0], 0, p[1],  0, 0, 0);
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
            geo.computeVertexNormals();
            return geo;
        }

        function initCrystal() {
            const stage = document.getElementById('stage');
            const tip = document.getElementById('tip');
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
            camera.position.set(0, 2.2, 10.5);
            camera.lookAt(0, 0.3, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            stage.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0x8fa8ff, 0.6));
            const key = new THREE.DirectionalLight(0xffffff, 1.15);
            key.position.set(4, 7, 6);
            scene.add(key);
            const rim = new THREE.PointLight(0x7aa7ff, 1.5, 30);
            rim.position.set(-6, 1, -4);
            scene.add(rim);
            const warm = new THREE.PointLight(0xffc247, 1.0, 30);
            warm.position.set(5, -1, 4);
            scene.add(warm);

            const cluster = new THREE.Group();
            cluster.position.y = -1.6;
            scene.add(cluster);

            // סלע הבסיס שממנו צומחים הגבישים
            const rock = new THREE.Mesh(
                new THREE.CylinderGeometry(2.3, 2.7, 0.5, 7, 1),
                new THREE.MeshStandardMaterial({ color: 0x1a2f5c, roughness: 0.9, metalness: 0.1, flatShading: true })
            );
            rock.position.y = -0.24;
            cluster.add(rock);

            const meshes = [];
            const up = new THREE.Vector3(0, 1, 0);
            FACETS.forEach((f, i) => {
                const pivot = new THREE.Group();
                pivot.position.set(f.pos[0], 0.02, f.pos[2]);
                if (f.lean) {
                    const phi = Math.atan2(f.pos[2], f.pos[0]);
                    const dir = new THREE.Vector3(Math.sin(f.lean) * Math.cos(phi), Math.cos(f.lean), Math.sin(f.lean) * Math.sin(phi));
                    pivot.quaternion.setFromUnitVectors(up, dir);
                }
                pivot.rotation.y += 0; // הכיוון נקבע ע"י ה-quaternion

                const geo = crystalGeometry(f.r, f.h);
                const mat = new THREE.MeshPhysicalMaterial({
                    color: f.color,
                    metalness: 0.15,
                    roughness: 0.1,
                    clearcoat: 1,
                    clearcoatRoughness: 0.06,
                    transparent: true,
                    opacity: 0.84,
                    side: THREE.DoubleSide,
                    flatShading: true,
                    emissive: f.color,
                    emissiveIntensity: 0.14
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.userData = { index: i };
                pivot.add(mesh);
                pivot.add(new THREE.LineSegments(
                    new THREE.EdgesGeometry(geo, 1),
                    new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 })
                ));
                cluster.add(pivot);
                meshes.push({ mesh, pivot });
            });

            // נצנוצים סביב
            const sparkGeo = new THREE.BufferGeometry();
            const n = 240, pts = new Float32Array(n * 3);
            for (let i = 0; i < n; i++) {
                const r = 3.4 + Math.random() * 4.5, t = Math.random() * Math.PI * 2, u = (Math.random() - 0.3) * 6;
                pts[i * 3] = Math.cos(t) * r; pts[i * 3 + 1] = u; pts[i * 3 + 2] = Math.sin(t) * r - 2;
            }
            sparkGeo.setAttribute('position', new THREE.BufferAttribute(pts, 3));
            const sparks = new THREE.Points(sparkGeo, new THREE.PointsMaterial({ color: 0xcfe0ff, size: 0.045, transparent: true, opacity: 0.7 }));
            scene.add(sparks);

            // ---- אינטראקציה: גרירה לסיבוב, ריחוף להדגשה, לחיצה (בלי גרירה) לניווט ----
            const raycaster = new THREE.Raycaster();
            const pointer = new THREE.Vector2();
            const canvas = renderer.domElement;
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            let dragging = false, moved = 0, lastX = 0, lastY = 0, velY = reduceMotion ? 0 : 0.0035, hovered = -1;
            cluster.rotation.x = 0.05;

            function resize() {
                const w = window.innerWidth, h = window.innerHeight;
                renderer.setSize(w, h, false);
                camera.aspect = w / h;
                camera.position.z = w < 700 ? 15 : 10.5;
                camera.updateProjectionMatrix();
            }
            window.addEventListener('resize', resize);
            resize();

            function pick(ev) {
                const r = canvas.getBoundingClientRect();
                pointer.x = ((ev.clientX - r.left) / r.width) * 2 - 1;
                pointer.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
                raycaster.setFromCamera(pointer, camera);
                const hit = raycaster.intersectObjects(meshes.map(m => m.mesh), false)[0];
                return hit ? hit.object.userData.index : -1;
            }

            function setHover(idx, ev) {
                if (idx === hovered && !ev) return;
                hovered = idx;
                dockLinks.forEach((a, i) => a.classList.toggle('active', i === idx));
                canvas.classList.toggle('hovering', idx >= 0 && !dragging);
                if (idx >= 0 && ev) {
                    tip.textContent = FACETS[idx].ico + ' ' + FACETS[idx].label;
                    tip.style.left = ev.clientX + 'px';
                    tip.style.top = ev.clientY + 'px';
                    tip.classList.add('show');
                } else {
                    tip.classList.remove('show');
                }
            }

            canvas.addEventListener('pointerdown', (e) => {
                dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
                canvas.setPointerCapture(e.pointerId);
                canvas.classList.add('dragging');
            });

            canvas.addEventListener('pointermove', (e) => {
                if (dragging) {
                    const dx = e.clientX - lastX, dy = e.clientY - lastY;
                    moved += Math.abs(dx) + Math.abs(dy);
                    cluster.rotation.y += dx * 0.01;
                    cluster.rotation.x = Math.max(-0.35, Math.min(0.5, cluster.rotation.x + dy * 0.004));
                    velY = dx * 0.002;
                    lastX = e.clientX; lastY = e.clientY;
                    setHover(-1);
                } else {
                    setHover(pick(e), e);
                }
            });

            canvas.addEventListener('pointerup', (e) => {
                dragging = false;
                canvas.classList.remove('dragging');
                if (moved < 6) {
                    const idx = pick(e);
                    if (idx >= 0) window.location.href = FACETS[idx].href;
                } else if (!reduceMotion) {
                    velY = Math.max(-0.02, Math.min(0.02, velY)) || 0.0035;
                }
            });

            canvas.addEventListener('pointerleave', () => setHover(-1));

            dockLinks.forEach((a, i) => {
                a.addEventListener('mouseenter', () => { hovered = i; dockLinks.forEach((x, j) => x.classList.toggle('active', j === i)); });
                a.addEventListener('mouseleave', () => { hovered = -1; a.classList.remove('active'); });
            });

            const clock = new THREE.Clock();
            function frame() {
                const t = clock.getElapsedTime();
                if (!dragging) {
                    cluster.rotation.y += velY;
                    velY += ((reduceMotion ? 0 : 0.0035) - velY) * 0.02;
                }
                cluster.position.y = -1.6 + (reduceMotion ? 0 : Math.sin(t * 0.9) * 0.06);
                sparks.rotation.y = t * 0.02;
                meshes.forEach(({ mesh, pivot }, i) => {
                    const on = i === hovered;
                    mesh.material.emissiveIntensity += ((on ? 0.7 : 0.14) - mesh.material.emissiveIntensity) * 0.15;
                    mesh.material.opacity += ((on ? 0.96 : 0.84) - mesh.material.opacity) * 0.15;
                    const s = pivot.scale.x + ((on ? 1.05 : 1) - pivot.scale.x) * 0.15;
                    pivot.scale.setScalar(s);
                });
                renderer.render(scene, camera);
                requestAnimationFrame(frame);
            }
            frame();
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>גביש</title>
    <style>
        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
            background: radial-gradient(ellipse at 50% 35%, #2a5298 0%, #1e3c72 45%, #0f1f3d 100%);
        }

        #stage {
            position: fixed;
            inset: 0;
        }

        #stage canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: grab;
        }

        #stage canvas.dragging { cursor: grabbing; }
        #stage canvas.hovering { cursor: pointer; }

        .top {
            position: fixed;
            top: 22px;
            left: 0;
            right: 0;
            text-align: center;
            pointer-events: none;
            z-index: 2;
        }

        .top h1 {
            margin: 0;
            font-size: clamp(1.4rem, 3.2vw, 2.4rem);
            letter-spacing: 1px;
            text-shadow: 0 2px 18px rgba(120, 170, 255, 0.55);
        }

        .top .subtitle {
            margin-top: 4px;
            font-size: 0.95rem;
            color: #cfe0ff;
        }

        .top .status {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 16px;
            font-size: 0.85rem;
            color: #ffd166;
            background: rgba(255, 209, 102, 0.12);
            border: 1px solid rgba(255, 209, 102, 0.35);
            border-radius: 999px;
        }

        #tip {
            position: fixed;
            z-index: 3;
            pointer-events: none;
            padding: 8px 14px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #10244a;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
            transform: translate(-50%, -140%);
            opacity: 0;
            transition: opacity 0.12s;
            white-space: nowrap;
        }

        #tip.show { opacity: 1; }

        .dock {
            position: fixed;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            z-index: 2;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: min(980px, calc(100vw - 24px));
        }

        .dock a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 14px;
            backdrop-filter: blur(8px);
            transition: background 0.15s, transform 0.15s, border-color 0.15s;
        }

                .dock a:hover, .dock a.active, .dock a:focus-visible {
            background: rgba(255, 255, 255, 0.24);
            transform: translateY(-3px);
            outline: none;
        }

        .dock a .ico { font-size: 1.15rem; }

        .fallback {
            display: none;
            position: fixed;
            top: 40%;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 1rem;
            color: #cfe0ff;
        }

        @media (max-width: 600px) {
            .dock { gap: 6px; bottom: 12px; }
            .dock a { padding: 8px 11px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <div id="stage"></div>

    <div class="top">
        <h1>גביש 💎</h1>
        <div class="subtitle">כל הפרויקטים במקום אחד</div>
        <div class="status" id="status"></div>
    </div>

    <div id="tip"></div>

    <nav class="dock" id="dock" aria-label="יעדים"></nav>

    <div class="fallback" id="fallback">לא ניתן לטעון את הגביש התלת-ממדי - אפשר להשתמש בכפתורים למטה.</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // פאות הגביש = הפרויקטים (גביש חמש-פאי). הקישורים לפי הכתובות שבהן כל פרויקט מתפרסם.
        const FACETS = [
            { id: 'timer',  ico: '🏡', label: 'עוברים לאבן יהודה',     href: '../',                                         color: 0x4f8cff },
            { id: 'house',  ico: '📊', label: 'ניהול הוצאות והכנסות',   href: 'https://gavishori.github.io/Manage_House/',   color: 0xffc247 },
            { id: 'ziv',    ico: '🏢', label: 'פיכמן 5 - הכנסות והוצאות', href: 'https://gavishori.github.io/ZIV/',            color: 0x35c2c9 },
            { id: 'radio',  ico: '📻', label: 'רדיו נקי',               href: 'https://gavishori.github.io/Radio/',          color: 0x9a6cff },
            { id: 'lappid', ico: '🚑', label: 'חפ"ק לפיד',              href: 'https://gavishori.github.io/Lappid_Rescue/',  color: 0xff7a59 }
        ];

        // ---- סטטוס המעבר (בלי שרת - מחושב מהתאריך) ----
        (function status() {
            const target = new Date('2026-09-28T08:00:00+03:00');
            const days = Math.floor(Math.abs(Date.now() - target) / 86400000);
            document.getElementById('status').textContent = Date.now() >= target
                ? `🎉 באבן יהודה כבר ${days} ימים`
                : `⏳ ${days} ימים עד המעבר`;
        })();

        // ---- כפתורי היעדים (תמיד קיימים - גם נגישות וגם גיבוי בלי WebGL) ----
        const dock = document.getElementById('dock');
        const dockLinks = FACETS.map(f => {
            const a = document.createElement('a');
            a.href = f.href;
            a.className = '';
            a.style.borderColor = '#' + f.color.toString(16).padStart(6, '0') + '99';
            a.innerHTML = `<span class="ico">${f.ico}</span><span>${f.label}</span>`;
            dock.appendChild(a);
            return a;
        });

        if (typeof THREE === 'undefined') {
            document.getElementById('fallback').style.display = 'block';
        } else {
            initCrystal();
        }

        function initCrystal() {
            const stage = document.getElementById('stage');
            const tip = document.getElementById('tip');
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
            camera.position.set(0, 0.4, 9.2);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            stage.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0x8fa8ff, 0.55));
            const key = new THREE.DirectionalLight(0xffffff, 1.1);
            key.position.set(4, 6, 6);
            scene.add(key);
            const rim = new THREE.PointLight(0x7aa7ff, 1.6, 30);
            rim.position.set(-5, -2, -4);
            scene.add(rim);
            const warm = new THREE.PointLight(0xffc247, 1.1, 30);
            warm.position.set(5, -3, 3);
            scene.add(warm);

            // גביש: מנסרה (לפי מספר הפרויקטים) עם קודקודים מחודדים למעלה ולמטה; כל פאה = רצועה (צד + משולש עליון + משולש תחתון)
            const R = 1.25, H = 2.3, CAP = 1.35;
            const crystal = new THREE.Group();
            scene.add(crystal);
            const facetMeshes = [];

            const N = FACETS.length;
            const ring = (k) => {
                const a1 = (k * 2 * Math.PI) / N - Math.PI / N;
                const a2 = ((k + 1) * 2 * Math.PI) / N - Math.PI / N;
                return [[R * Math.cos(a1), R * Math.sin(a1)], [R * Math.cos(a2), R * Math.sin(a2)]];
            };

            FACETS.forEach((f, k) => {
                const [p1, p2] = ring(k);
                const bot = -H / 2, top = H / 2;
                const v = [
                    // צד
                    p1[0], bot, p1[1],  p2[0], bot, p2[1],  p2[0], top, p2[1],
                    p1[0], bot, p1[1],  p2[0], top, p2[1],  p1[0], top, p1[1],
                    // כיפה עליונה
                    p1[0], top, p1[1],  p2[0], top, p2[1],  0, top + CAP, 0,
                    // כיפה תחתונה
                    p2[0], bot, p2[1],  p1[0], bot, p1[1],  0, bot - CAP, 0
                ];
                const geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
                geo.computeVertexNormals();

                const mat = new THREE.MeshPhysicalMaterial({
                    color: f.color,
                    metalness: 0.15,
                    roughness: 0.12,
                    clearcoat: 1,
                    clearcoatRoughness: 0.08,
                    transparent: true,
                    opacity: 0.8,
                    side: THREE.DoubleSide,
                    flatShading: true,
                    emissive: f.color,
                    emissiveIntensity: 0.12
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.userData = { index: k, facet: f };
                crystal.add(mesh);
                facetMeshes.push(mesh);

                // קווי מסגרת דקים בין הפאות
                const edges = new THREE.LineSegments(
                    new THREE.EdgesGeometry(geo, 1),
                    new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55 })
                );
                crystal.add(edges);
            });

            // ליבה זוהרת בתוך הגביש
            const core = new THREE.Mesh(
                new THREE.OctahedronGeometry(0.7, 0),
                new THREE.MeshBasicMaterial({ color: 0xbcd4ff, wireframe: true, transparent: true, opacity: 0.55 })
            );
            crystal.add(core);

            // נצנוצים סביב
            const sparkGeo = new THREE.BufferGeometry();
            const n = 220, pts = new Float32Array(n * 3);
            for (let i = 0; i < n; i++) {
                const r = 3.2 + Math.random() * 4.5, t = Math.random() * Math.PI * 2, u = (Math.random() - 0.5) * 6;
                pts[i * 3] = Math.cos(t) * r; pts[i * 3 + 1] = u; pts[i * 3 + 2] = Math.sin(t) * r - 2;
            }
            sparkGeo.setAttribute('position', new THREE.BufferAttribute(pts, 3));
            const sparks = new THREE.Points(sparkGeo, new THREE.PointsMaterial({ color: 0xcfe0ff, size: 0.045, transparent: true, opacity: 0.7 }));
            scene.add(sparks);

            // ---- אינטראקציה: גרירה לסיבוב, ריחוף להדגשה, לחיצה (בלי גרירה) לניווט ----
            const raycaster = new THREE.Raycaster();
            const pointer = new THREE.Vector2();
            const canvas = renderer.domElement;
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            let dragging = false, moved = 0, lastX = 0, lastY = 0, velY = reduceMotion ? 0 : 0.004, hovered = -1;
            crystal.rotation.x = 0.18;

            function resize() {
                const w = window.innerWidth, h = window.innerHeight;
                renderer.setSize(w, h, false);
                camera.aspect = w / h;
                camera.position.z = w < 700 ? 12.5 : 9.2;
                camera.updateProjectionMatrix();
            }
            window.addEventListener('resize', resize);
            resize();

            function pick(ev) {
                const r = canvas.getBoundingClientRect();
                pointer.x = ((ev.clientX - r.left) / r.width) * 2 - 1;
                pointer.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
                raycaster.setFromCamera(pointer, camera);
                const hit = raycaster.intersectObjects(facetMeshes, false)[0];
                return hit ? hit.object.userData.index : -1;
            }

            function setHover(idx, ev) {
                if (idx === hovered && !ev) return;
                hovered = idx;
                dockLinks.forEach((a, i) => a.classList.toggle('active', i === idx));
                canvas.classList.toggle('hovering', idx >= 0 && !dragging);
                if (idx >= 0 && ev) {
                    tip.textContent = FACETS[idx].ico + ' ' + FACETS[idx].label;
                    tip.style.left = ev.clientX + 'px';
                    tip.style.top = ev.clientY + 'px';
                    tip.classList.add('show');
                } else {
                    tip.classList.remove('show');
                }
            }

            canvas.addEventListener('pointerdown', (e) => {
                dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
                canvas.setPointerCapture(e.pointerId);
                canvas.classList.add('dragging');
            });

            canvas.addEventListener('pointermove', (e) => {
                if (dragging) {
                    const dx = e.clientX - lastX, dy = e.clientY - lastY;
                    moved += Math.abs(dx) + Math.abs(dy);
                    crystal.rotation.y += dx * 0.01;
                    crystal.rotation.x = Math.max(-0.9, Math.min(0.9, crystal.rotation.x + dy * 0.006));
                    velY = dx * 0.002;
                    lastX = e.clientX; lastY = e.clientY;
                    setHover(-1);
                } else {
                    setHover(pick(e), e);
                }
            });

            canvas.addEventListener('pointerup', (e) => {
                dragging = false;
                canvas.classList.remove('dragging');
                if (moved < 6) {
                    const idx = pick(e);
                    if (idx >= 0) window.location.href = FACETS[idx].href;
                } else if (!reduceMotion) {
                    velY = Math.max(-0.02, Math.min(0.02, velY)) || 0.004;
                }
            });

            canvas.addEventListener('pointerleave', () => setHover(-1));

            dockLinks.forEach((a, i) => {
                a.addEventListener('mouseenter', () => { hovered = i; dockLinks.forEach((x, j) => x.classList.toggle('active', j === i)); });
                a.addEventListener('mouseleave', () => { hovered = -1; a.classList.remove('active'); });
            });

            const clock = new THREE.Clock();
            function frame() {
                const t = clock.getElapsedTime();
                if (!dragging) {
                    crystal.rotation.y += velY;
                    velY += ((reduceMotion ? 0 : 0.004) - velY) * 0.02;
                }
                crystal.position.y = reduceMotion ? 0 : Math.sin(t * 0.9) * 0.1;
                core.rotation.y = t * 0.6;
                core.rotation.x = t * 0.3;
                sparks.rotation.y = t * 0.02;
                facetMeshes.forEach((m, i) => {
                    const target = i === hovered ? 0.65 : 0.12;
                    m.material.emissiveIntensity += (target - m.material.emissiveIntensity) * 0.15;
                    m.material.opacity += ((i === hovered ? 0.95 : 0.8) - m.material.opacity) * 0.15;
                });
                renderer.render(scene, camera);
                requestAnimationFrame(frame);
            }
            frame();
        }
    </script>
</body>
</html>

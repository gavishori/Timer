<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>גביש</title>
    <style>
        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
            background: radial-gradient(ellipse at 50% 40%, #2a5298 0%, #1e3c72 45%, #0f1f3d 100%);
        }

        #stage {
            position: fixed;
            inset: 0;
        }

        #stage canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: grab;
        }

        #stage canvas.dragging { cursor: grabbing; }
        #stage canvas.hovering { cursor: pointer; }

        .top {
            position: fixed;
            top: 22px;
            left: 0;
            right: 0;
            text-align: center;
            pointer-events: none;
            z-index: 2;
        }

        .top h1 {
            margin: 0;
            font-size: clamp(1.4rem, 3.2vw, 2.4rem);
            letter-spacing: 1px;
            text-shadow: 0 2px 18px rgba(120, 170, 255, 0.55);
        }

        .top .subtitle {
            margin-top: 4px;
            font-size: 0.95rem;
            color: #cfe0ff;
        }

        .top .status {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 16px;
            font-size: 0.85rem;
            color: #ffd166;
            background: rgba(255, 209, 102, 0.12);
            border: 1px solid rgba(255, 209, 102, 0.35);
            border-radius: 999px;
        }

        #tip {
            position: fixed;
            z-index: 3;
            pointer-events: none;
            padding: 8px 14px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #10244a;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
            transform: translate(-50%, -140%);
            opacity: 0;
            transition: opacity 0.12s;
            white-space: nowrap;
        }

        #tip.show { opacity: 1; }

        .dock {
            position: fixed;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            z-index: 2;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: min(980px, calc(100vw - 24px));
        }

        .dock a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 14px;
            backdrop-filter: blur(8px);
            transition: background 0.15s, transform 0.15s;
        }

        .dock a:hover, .dock a.active, .dock a:focus-visible {
            background: rgba(255, 255, 255, 0.24);
            transform: translateY(-3px);
            outline: none;
        }

        .dock a .ico { font-size: 1.15rem; }

        .fallback {
            display: none;
            position: fixed;
            top: 40%;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 1rem;
            color: #cfe0ff;
        }

        @media (max-width: 600px) {
            .dock { gap: 6px; bottom: 12px; }
            .dock a { padding: 8px 11px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <div id="stage"></div>

    <div class="top">
        <h1>גביש 💎</h1>
        <div class="subtitle">כל הפרויקטים במקום אחד</div>
        <div class="status" id="status"></div>
    </div>

    <div id="tip"></div>

    <nav class="dock" id="dock" aria-label="פרויקטים"></nav>

    <div class="fallback" id="fallback">לא ניתן לטעון את הגביש התלת-ממדי - אפשר להשתמש בכפתורים למטה.</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // כל פאה של היהלום = פרויקט. הקישורים לפי הכתובות שבהן כל פרויקט מתפרסם.
        const FACETS = [
            { id: 'timer',   ico: '🏡', label: 'אבן יהודה',        href: '../',                                        color: 0x4f8cff },
            { id: 'house',   ico: '📊', label: 'גביש - פיננסי',     href: 'https://gavishori.github.io/Manage_House/',  color: 0xffc247 },
            { id: 'ziv',     ico: '🏢', label: 'אמא + זיו',         href: 'https://gavishori.github.io/ZIV/',           color: 0x35c2c9 },
            { id: 'radio',   ico: '📻', label: 'רדיו',              href: 'https://gavishori.github.io/Radio/',         color: 0x9a6cff },
            { id: 'flymily', ico: '✈️', label: 'FLYMILY',           href: 'https://gavishori.github.io/flymily/',       color: 0xff5fa2 },
            { id: 'lappid',  ico: '🚑', label: 'חפ"ק',              href: 'https://gavishori.github.io/Lappid_Rescue/', color: 0xff7a59 },
            { id: 'gremson', ico: '🤝', label: 'GREMSON',           href: '../gremson/',                                 color: 0x5ad19a }
        ];

        // ---- סטטוס המעבר (בלי שרת - מחושב מהתאריך) ----
        (function status() {
            const target = new Date('2026-09-28T08:00:00+03:00');
            const days = Math.floor(Math.abs(Date.now() - target) / 86400000);
            document.getElementById('status').textContent = Date.now() >= target
                ? `🎉 באבן יהודה כבר ${days} ימים`
                : `⏳ ${days} ימים עד המעבר`;
        })();

        // ---- כפתורי הפרויקטים (תמיד קיימים - גם נגישות וגם גיבוי בלי WebGL) ----
        const dock = document.getElementById('dock');
        const dockLinks = FACETS.map(f => {
            const a = document.createElement('a');
            a.href = f.href;
            a.style.borderColor = '#' + f.color.toString(16).padStart(6, '0') + '99';
            a.innerHTML = `<span class="ico">${f.ico}</span><span>${f.label}</span>`;
            dock.appendChild(a);
            return a;
        });

        if (typeof THREE === 'undefined') {
            document.getElementById('fallback').style.display = 'block';
        } else {
            initDiamond();
        }

        // מפת סביבה שנוצרת בקוד (פסי אור וצל) - היא שנותנת ליהלום את ההשתקפויות המנצנצות
        function makeEnvironment(renderer) {
            const c = document.createElement('canvas');
            c.width = 1024; c.height = 512;
            const g = c.getContext('2d');
            const grad = g.createLinearGradient(0, 0, 0, 512);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.45, '#9db8ec');
            grad.addColorStop(1, '#0a1730');
            g.fillStyle = grad;
            g.fillRect(0, 0, 1024, 512);
            for (let i = 0; i < 90; i++) {
                const bright = Math.random() < 0.6;
                g.fillStyle = bright ? `rgba(255,255,255,${0.5 + Math.random() * 0.5})` : `rgba(8,18,44,${0.4 + Math.random() * 0.5})`;
                const x = Math.random() * 1024, y = Math.random() * 512;
                const w = 20 + Math.random() * 120, h = 8 + Math.random() * 60;
                g.save();
                g.translate(x, y);
                g.rotate(Math.random() * Math.PI);
                g.fillRect(-w / 2, -h / 2, w, h);
                g.restore();
            }
            const tex = new THREE.CanvasTexture(c);
            tex.mapping = THREE.EquirectangularReflectionMapping;
            const pmrem = new THREE.PMREMGenerator(renderer);
            const env = pmrem.fromEquirectangular(tex).texture;
            tex.dispose();
            pmrem.dispose();
            return env;
        }

        // יהלום בחיתוך "בריליאנט": שולחן עליון, כתר, חגורה דקה וקצה מחודד למטה.
        // הוא מחולק ל-N גזרות (אחת לפרויקט); כל גזרה = פאות הכתר, החגורה והקצה שמתחתיה.
        function sectorGeometry(k, N, R, crownH, pavilionH) {
            const rt = R * 0.56, gy = 0.05;
            const ang = (i) => (i * 2 * Math.PI) / N + Math.PI / N;
            const a1 = ang(k), a2 = ang(k + 1), am = (a1 + a2) / 2;
            const P = (r, a, y) => [r * Math.cos(a), y, r * Math.sin(a)];
            const t1 = P(rt, a1, crownH), t2 = P(rt, a2, crownH), tm = P(rt * 0.97, am, crownH);
            const g1 = P(R, a1, gy), g2 = P(R, a2, gy), gm = P(R * 1.03, am, gy);
            const b1 = P(R, a1, -gy), b2 = P(R, a2, -gy), bm = P(R * 1.03, am, -gy);
            const top = [0, crownH + 0.03, 0], culet = [0, -pavilionH, 0];
            const pm1 = P(R * 0.62, (a1 + am) / 2, -pavilionH * 0.45), pm2 = P(R * 0.62, (am + a2) / 2, -pavilionH * 0.45);
            const tris = [
                [top, t1, t2],
                [t1, tm, g1], [tm, gm, g1], [tm, t2, gm], [t2, g2, gm],
                [t1, t2, tm],
                [g1, gm, b1], [gm, bm, b1], [gm, g2, bm], [g2, b2, bm],
                [b1, bm, pm1], [bm, pm2, pm1], [bm, b2, pm2],
                [b1, pm1, culet], [pm1, pm2, culet], [pm2, b2, culet]
            ];
            const v = [];
            tris.forEach(t => t.forEach(p => v.push(p[0], p[1], p[2])));
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
            geo.computeVertexNormals();
            return geo;
        }

        function initDiamond() {
            const stage = document.getElementById('stage');
            const tip = document.getElementById('tip');
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 100);
            camera.position.set(0, 1.6, 11);
            camera.lookAt(0, -0.2, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            stage.appendChild(renderer.domElement);
            scene.environment = makeEnvironment(renderer);

            scene.add(new THREE.AmbientLight(0xaac0ff, 0.5));
            const key = new THREE.DirectionalLight(0xffffff, 1.0);
            key.position.set(4, 8, 6);
            scene.add(key);
            const rim = new THREE.PointLight(0x88aaff, 1.2, 30);
            rim.position.set(-6, 2, -4);
            scene.add(rim);

            const R = 2.3, N = FACETS.length;
            const gem = new THREE.Group();
            scene.add(gem);
            const white = new THREE.Color(0xffffff);
            const sectors = [];

            FACETS.forEach((f, k) => {
                const geo = sectorGeometry(k, N, R, 0.95, 2.1);
                const tint = new THREE.Color(f.color).lerp(white, 0.62);
                const mat = new THREE.MeshStandardMaterial({
                    color: tint,
                    metalness: 1,
                    roughness: 0.07,
                    flatShading: true,
                    envMapIntensity: 1.35,
                    emissive: new THREE.Color(f.color),
                    emissiveIntensity: 0.05,
                    side: THREE.DoubleSide
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.userData = { index: k };
                gem.add(mesh);
                gem.add(new THREE.LineSegments(
                    new THREE.EdgesGeometry(geo, 12),
                    new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 })
                ));
                sectors.push(mesh);
            });

            // נצנוצים סביב
            const sparkGeo = new THREE.BufferGeometry();
            const n = 260, pts = new Float32Array(n * 3);
            for (let i = 0; i < n; i++) {
                const r = 3.8 + Math.random() * 5, t = Math.random() * Math.PI * 2, u = (Math.random() - 0.5) * 7;
                pts[i * 3] = Math.cos(t) * r; pts[i * 3 + 1] = u; pts[i * 3 + 2] = Math.sin(t) * r - 2;
            }
            sparkGeo.setAttribute('position', new THREE.BufferAttribute(pts, 3));
            const sparks = new THREE.Points(sparkGeo, new THREE.PointsMaterial({ color: 0xdbe7ff, size: 0.05, transparent: true, opacity: 0.75 }));
            scene.add(sparks);

            // ---- אינטראקציה: גרירה לסיבוב, ריחוף להדגשה, לחיצה (בלי גרירה) לניווט ----
            const raycaster = new THREE.Raycaster();
            const pointer = new THREE.Vector2();
            const canvas = renderer.domElement;
            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            let dragging = false, moved = 0, lastX = 0, lastY = 0, velY = reduceMotion ? 0 : 0.0035, hovered = -1;
            gem.rotation.x = 0.28;

            function resize() {
                const w = window.innerWidth, h = window.innerHeight;
                renderer.setSize(w, h, false);
                camera.aspect = w / h;
                camera.position.z = w < 700 ? 15 : 11;
                camera.updateProjectionMatrix();
            }
            window.addEventListener('resize', resize);
            resize();

            function pick(ev) {
                const r = canvas.getBoundingClientRect();
                pointer.x = ((ev.clientX - r.left) / r.width) * 2 - 1;
                pointer.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
                raycaster.setFromCamera(pointer, camera);
                const hit = raycaster.intersectObjects(sectors, false)[0];
                return hit ? hit.object.userData.index : -1;
            }

            function setHover(idx, ev) {
                if (idx === hovered && !ev) return;
                hovered = idx;
                dockLinks.forEach((a, i) => a.classList.toggle('active', i === idx));
                canvas.classList.toggle('hovering', idx >= 0 && !dragging);
                if (idx >= 0 && ev) {
                    tip.textContent = FACETS[idx].ico + ' ' + FACETS[idx].label;
                    tip.style.left = ev.clientX + 'px';
                    tip.style.top = ev.clientY + 'px';
                    tip.classList.add('show');
                } else {
                    tip.classList.remove('show');
                }
            }

            canvas.addEventListener('pointerdown', (e) => {
                dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
                canvas.setPointerCapture(e.pointerId);
                canvas.classList.add('dragging');
            });

            canvas.addEventListener('pointermove', (e) => {
                if (dragging) {
                    const dx = e.clientX - lastX, dy = e.clientY - lastY;
                    moved += Math.abs(dx) + Math.abs(dy);
                    gem.rotation.y += dx * 0.01;
                    gem.rotation.x = Math.max(-0.2, Math.min(0.9, gem.rotation.x + dy * 0.005));
                    velY = dx * 0.002;
                    lastX = e.clientX; lastY = e.clientY;
                    setHover(-1);
                } else {
                    setHover(pick(e), e);
                }
            });

            canvas.addEventListener('pointerup', (e) => {
                dragging = false;
                canvas.classList.remove('dragging');
                if (moved < 6) {
                    const idx = pick(e);
                    if (idx >= 0) window.location.href = FACETS[idx].href;
                } else if (!reduceMotion) {
                    velY = Math.max(-0.02, Math.min(0.02, velY)) || 0.0035;
                }
            });

            canvas.addEventListener('pointerleave', () => setHover(-1));

            dockLinks.forEach((a, i) => {
                a.addEventListener('mouseenter', () => { hovered = i; dockLinks.forEach((x, j) => x.classList.toggle('active', j === i)); });
                a.addEventListener('mouseleave', () => { hovered = -1; a.classList.remove('active'); });
            });

            const clock = new THREE.Clock();
            function frame() {
                const t = clock.getElapsedTime();
                if (!dragging) {
                    gem.rotation.y += velY;
                    velY += ((reduceMotion ? 0 : 0.0035) - velY) * 0.02;
                }
                gem.position.y = reduceMotion ? 0 : Math.sin(t * 0.9) * 0.1;
                sparks.rotation.y = t * 0.02;
                sectors.forEach((m, i) => {
                    const on = i === hovered;
                    m.material.emissiveIntensity += ((on ? 0.75 : 0.05) - m.material.emissiveIntensity) * 0.15;
                });
                renderer.render(scene, camera);
                requestAnimationFrame(frame);
            }
            frame();
        }
    </script>
</body>
</html>
